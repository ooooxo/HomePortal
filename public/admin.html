<!DOCTYPE html>
<!--
  管理后台：登录（整幅液体背景，站名压进液面）+ 入口管理（左列表带各自封面，右表单带实时封面预览）。
  与首页同一套语言与同一个 shader（liquid.js）；控件全部自绘：分段选择、两步确认，不用原生 select / confirm。
  首页 /#admin 以 iframe 嵌入本页（?embed=1）；直接打开 /admin.html 会被 server.js 重定向到 /#admin。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>管理后台</title>
  <style>
    :root {
      --bg: #0c0c0e; --surface: #141416; --surface2: #1c1c1f; --inset: #222226;
      --line: rgba(242, 243, 245, .08); --line-strong: rgba(242, 243, 245, .15);
      --ink: #f2f3f5; --ink-2: #9ba1ac; --ink-3: #5d646f;
      --accent: #38bdf8; --green: #34d399; --amber: #fbbf24; --red: #f0806e;
      --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
      --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
      --r: 12px; --r-sm: 9px;
      /* 缓动按用途：A→B in-out，出现消失 out，悬停换色 hover；按压回弹用 spring-soft */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-hover: cubic-bezier(0.4, 0, 0.2, 1); --spring-soft: cubic-bezier(0.22, 1.2, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .k-app { --kc: #38bdf8; } .k-res { --kc: #34d399; } .k-site { --kc: #818cf8; }

    /* ---- 按钮 ---- */
    .btn { height: 40px; padding: 0 18px; border-radius: 20px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background .16s var(--ease-hover), color .16s var(--ease-hover), box-shadow .16s var(--ease-hover), transform .3s var(--spring-soft), opacity .16s var(--ease-hover); }
    .btn:active { transform: scale(.96); transition-duration: .08s; }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn[hidden] { display: none; }
    .btn.p { background: var(--ink); color: var(--bg); }
    .btn.g { background: rgba(255, 255, 255, .05); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
    .btn.g:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .btn.armed { color: var(--red); background: rgba(240, 128, 110, .12); box-shadow: inset 0 0 0 1px rgba(240, 128, 110, .4); }
    .btn svg { width: 15px; height: 15px; }
    .gl { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--ink-3);
      transition: color .16s var(--ease-hover), transform .3s var(--spring-soft); }
    .gl:hover { color: var(--ink); }
    .gl:active { transform: scale(.86); transition-duration: .08s; }
    .gl:disabled { opacity: .25; pointer-events: none; }
    .gl.armed { color: var(--red); width: auto; padding: 0 8px; font-size: 12px; font-weight: 600; }
    .gl svg { width: 16px; height: 16px; }

    /* ================= 登录 ================= */
    .gate { position: fixed; inset: 0; z-index: 10; }
    .gate .art { position: absolute; right: 0; top: 0; bottom: 0; width: 62%; overflow: hidden; transition: opacity 1.6s var(--ease-in-out), transform 2.2s var(--ease-out); }
    .gate .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .gate .art::after { content: ''; position: absolute; inset: 0 0 0 -2px; pointer-events: none; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 3%, rgba(12, 12, 14, 0) 32%); }
    .gate .side { position: absolute; left: 7%; top: 0; bottom: 0; width: min(380px, 80vw); z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    .gate .wm { position: absolute; left: 40px; top: 28px; z-index: 2; font-size: 14px; font-weight: 700; }
    .gate .eyebrow { font-size: 14px; color: var(--ink-3); }
    .gate h1 { margin: 0 0 18px; font-size: clamp(40px, 4.6vw, 68px); line-height: 1.04; font-weight: 650; letter-spacing: -0.04em; }
    .gate form { display: flex; flex-direction: column; gap: 12px; }
    .gate .err { min-height: 20px; font-size: 13px; color: var(--red); }
    .gate.shake form { animation: shake .42s var(--ease-out); }
    @keyframes shake { 20% { transform: translateX(-8px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
    .gate .side > *, .gate .wm { transition: opacity .8s var(--ease-out) var(--d, 0ms), transform .8s var(--ease-out) var(--d, 0ms), filter .8s var(--ease-out) var(--d, 0ms); }
    .gate.enter .art { opacity: 0; transform: scale(1.06); }
    .gate.enter .side > *, .gate.enter .wm { opacity: 0; transform: translateY(18px); filter: blur(6px); }
    .gate .eyebrow { --d: 300ms; } .gate h1 { --d: 400ms; } .gate form { --d: 550ms; } .gate .wm { --d: 200ms; }
    .gate.leave { opacity: 0; transition: opacity .45s var(--ease-in-out); pointer-events: none; }

    /* ---- 输入框（自绘） ---- */
    .in { width: 100%; height: 44px; padding: 0 14px; border-radius: var(--r-sm); border: 0; background: rgba(255, 255, 255, .05); color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--line); outline: none; font-size: 15px; transition: box-shadow .16s var(--ease-hover), background .16s var(--ease-hover); }
    .in::placeholder { color: var(--ink-3); }
    .in:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
    .in:focus { box-shadow: inset 0 0 0 1px rgba(56, 189, 248, .55), 0 0 0 3px rgba(56, 189, 248, .14); background: rgba(255, 255, 255, .07); }
    textarea.in { height: 84px; padding: 11px 14px; resize: vertical; line-height: 1.55; }

    /* ================= 管理面 ================= */
    .panel { min-height: 100vh; opacity: 0; transition: opacity .6s var(--ease-in-out); }
    .panel.on { opacity: 1; }
    .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 18px 32px; background: linear-gradient(var(--bg) 70%, rgba(12, 12, 14, 0)); }
    .top .wm { font-size: 14px; font-weight: 700; }
    .top .sub { font-size: 13px; color: var(--ink-3); margin-right: auto; }
    .main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; padding: 12px 32px 64px; max-width: 1240px; margin: 0 auto; }
    .sec-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
    .sec-head h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
    .sec-head .cnt { font-size: 13px; color: var(--ink-3); margin-right: auto; }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 10px; border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
      transition: box-shadow .16s var(--ease-hover), background .16s var(--ease-hover), opacity .5s var(--ease-out) var(--d, 0ms), transform .5s var(--ease-out) var(--d, 0ms); }
    .row:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
    .row.on { box-shadow: inset 0 0 0 1px rgba(56, 189, 248, .5); background: var(--surface2); }
    .row.off .thumb, .row.off .nm { opacity: .5; }
    .list.enter .row { opacity: 0; transform: translateY(10px); }
    .thumb { flex: none; width: 78px; height: 52px; border-radius: 7px; overflow: hidden; background: var(--inset); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .row .nm { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-3); min-width: 0; }
    .row .meta .url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
    .kind { flex: none; color: var(--kc); }
    .kind::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 9px; background: var(--kc); margin-right: 6px; vertical-align: 1px; }
    .pill { flex: none; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(255, 255, 255, .06); color: var(--ink-2); }
    .pill.off { color: var(--amber); background: rgba(251, 191, 36, .12); }
    .row .acts { flex: none; display: flex; align-items: center; gap: 2px; }
    .empty { padding: 48px 20px; text-align: center; color: var(--ink-3); font-size: 14px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); }

    /* ---- 表单 ---- */
    .form { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow-y: auto; overscroll-behavior: contain; align-self: start; display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
    .preview { position: relative; aspect-ratio: 3 / 2; border-radius: 10px; overflow: hidden; background: var(--inset); }
    .preview canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .preview .cap { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: rgba(242, 243, 245, .8); text-shadow: 0 1px 8px rgba(0, 0, 0, .7); }
    .preview .cap b { font-weight: 600; color: #fff; }
    .form h3 { margin: 0; font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
    .form h3 .dot { width: 7px; height: 7px; border-radius: 9px; background: var(--accent); }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
    .field label .req { color: var(--accent); margin-left: 3px; }
    .field .hint { font-size: 12px; color: var(--ink-3); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    /* 分段选择：替代原生 select；选中靠墨阶 + 抬起的底，不用彩色色块 */
    .seg { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, .04); box-shadow: inset 0 0 0 1px var(--line); }
    .seg button { flex: 1 0 auto; height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: none; color: var(--ink-3); font-size: 13px; cursor: pointer;
      transition: color .16s var(--ease-hover), background .16s var(--ease-hover), box-shadow .16s var(--ease-hover); }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, .09); box-shadow: 0 1px 2px rgba(0, 0, 0, .4); font-weight: 600; }
    .seg .sw { display: inline-block; width: 10px; height: 10px; border-radius: 9px; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
    .color-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .form .acts { display: flex; gap: 10px; }
    .form .acts .btn.p { flex: 1; }

    #toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; padding: 10px 16px; border-radius: 10px; background: #1e1e21; color: var(--ink); font-size: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--line);
      opacity: 0; transform: translate(-50%, 8px); pointer-events: none; transition: opacity .22s var(--ease-out), transform .22s var(--ease-out); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { color: var(--red); }

    @media (max-width: 900px) {
      .gate .art { width: 100%; opacity: .55; }
      .gate .art::after { background: linear-gradient(180deg, rgba(12, 12, 14, .2), var(--bg) 85%); }
      .gate .side { left: 24px; right: 24px; width: auto; justify-content: flex-end; padding-bottom: 12vh; }
      .gate .wm { left: 24px; }
      .main { grid-template-columns: minmax(0, 1fr); padding: 8px 16px 48px; }   /* minmax(0,…)：长网址不能把列撑出屏幕 */
      .top .sub { display: none; }
      .top .wm { margin-right: auto; }
      .top .btn { width: 40px; padding: 0; font-size: 0; gap: 0; }   /* 窄屏只留图标 */
      .top { padding: 14px 16px; }
      .form { position: static; max-height: none; overflow: visible; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status"></div>

  <script src="liquid.js"></script>
  <script>
    const { kindOf, MOTIFS, motifOf, loop, liquid, covers } = window.HP;
    /* ---- 可调参数 ---- */
    const ARM_MS = 3000;            // 两步确认：按一下进待确认态，这么久不按自动回落
    const PREVIEW_DEBOUNCE = 120;   // 表单输入后多久重算预览的字形纹理
    const LIQUID_RES = 0.6;         // 登录页液体画布分辨率（相对 CSS 像素）

    const PREFIX = (() => { const m = location.pathname.match(/^(\/[^/]+)/); return m && !/\.[a-z0-9]+$/i.test(m[1]) ? m[1] : ''; })();
    const apiPath = p => PREFIX + p;
    const $ = (s, el = document) => el.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ICON = {
      up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
      down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
      del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
      home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
      out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    };

    let token = sessionStorage.getItem('portal_token') || '';
    let title = '入口';
    let services = [];

    /* ---- 小件 ---- */
    let toastT;
    function toast(msg, type = '') { const t = $('#toast'); t.textContent = msg; t.className = 'show ' + type; clearTimeout(toastT); toastT = setTimeout(() => { t.className = type; }, 2400); }
    async function api(method, path, body) {
      const r = await fetch(apiPath(path), {
        method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json();
      if (r.status === 401 && token) { token = ''; sessionStorage.removeItem('portal_token'); showGate(); throw new Error('登录已过期，请重新登录'); }
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }
    /* 两步确认：第一下变红换字，ARM_MS 内再按才执行；离开焦点或超时回落 */
    function twoStep(btn, armedHTML, action) {
      if (btn.classList.contains('armed')) { clearTimeout(btn._t); btn.classList.remove('armed'); btn.innerHTML = btn._idle; action(); return; }
      btn._idle = btn.innerHTML; btn.classList.add('armed'); btn.innerHTML = armedHTML;
      const back = () => { clearTimeout(btn._t); if (btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.innerHTML = btn._idle; } };
      btn._t = setTimeout(back, ARM_MS); btn.addEventListener('blur', back, { once: true });
    }
    function goHome(e) {
      e?.preventDefault();
      const path = PREFIX ? PREFIX + '/' : '/';
      if (window.parent !== window) window.parent.location.href = path; else location.href = path;
    }
    function playEnter(el) { if (reduced) return; el.classList.add('enter'); void el.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter'))); }

    /* ================= 登录 ================= */
    let gateStop = null;
    function showGate() {
      unmountPanel();
      $('#app').innerHTML = `<div class="gate"><span class="wm">ooooxo</span><div class="art"><canvas></canvas></div>
        <div class="side"><div class="eyebrow">管理后台</div><h1>${esc(title)}</h1>
          <form id="loginForm"><input class="in" id="pwd" type="password" placeholder="管理密码" autocomplete="current-password" required />
            <button class="btn p" type="submit">进入</button><div class="err" id="err"></div></form></div></div>`;
      const gate = $('.gate'), art = $('.art', gate), cv = $('canvas', gate);
      playEnter(gate);
      const k = Math.min(devicePixelRatio || 1, 1.5) * LIQUID_RES;
      cv.width = Math.round(art.clientWidth * k); cv.height = Math.round(art.clientHeight * k);
      const L = liquid(cv);
      if (L) {
        // 登录页的液面压进站名；形态取「流动」
        const p = L.params({ name: title, url: '', description: '', motif: 'flow' });
        const stop = loop((dt, now) => L.draw(reduced ? 20 : now / 1000, p, p, 0));
        gateStop = () => { stop(); L.dispose(); };
      } else console.error('WebGL 不可用：登录页背景不渲染');
      $('#pwd').focus();
      $('#loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        const pwd = $('#pwd').value.trim(); if (!pwd) return;
        try {
          const data = await api('POST', '/api/auth', { password: pwd });
          token = data.token; sessionStorage.setItem('portal_token', token);
          gate.classList.add('leave'); setTimeout(showPanel, reduced ? 0 : 420);
        } catch (err) {
          $('#err').textContent = err.message === '密码错误' ? '密码不对，再试一次' : err.message;
          $('#pwd').value = ''; $('#pwd').focus();
          gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake');
        }
      });
    }

    /* ================= 管理面 ================= */
    let panelStop = null, editing = null, form = null;
    const EMPTY = { name: '', url: '', displayUrl: '', description: '', tags: [], motif: '', color: '', status: 'active' };
    const COLOR_AUTO = '';

    function unmountPanel() { panelStop?.(); panelStop = null; gateStop?.(); gateStop = null; }
    async function showPanel() {
      unmountPanel();
      $('#app').innerHTML = `<div class="panel">
        <header class="top"><span class="wm">ooooxo</span><span class="sub">管理后台 · ${esc(title)}</span>
          <a class="btn g" href="${PREFIX}/" id="home" aria-label="返回首页">${ICON.home}返回首页</a><button class="btn g" id="logout" aria-label="退出">${ICON.out}退出</button></header>
        <div class="main">
          <section><div class="sec-head"><h2>入口</h2><span class="cnt num" id="cnt"></span><button class="btn g" id="new">${ICON.plus}新增</button></div><div class="list" id="list"></div></section>
          <aside class="form" id="form"></aside>
        </div></div>`;
      requestAnimationFrame(() => $('.panel').classList.add('on'));
      $('#home').addEventListener('click', goHome);
      $('#logout').addEventListener('click', e => twoStep(e.currentTarget, `${ICON.out}再按退出`, () => { token = ''; sessionStorage.removeItem('portal_token'); showGate(); }));
      $('#new').addEventListener('click', () => edit(null));
      mountForm();
      try { services = await api('GET', '/api/services'); } catch (e) { toast(e.message, 'error'); return; }
      renderList(true);
      edit(null);
    }

    function renderList(enter = false) {
      const list = $('#list'); if (!list) return;
      $('#cnt').textContent = String(services.length).padStart(2, '0');
      if (!services.length) { list.innerHTML = '<div class="empty">还没有入口，右侧填好就能添加第一个</div>'; return; }
      const imgs = covers(services);
      list.innerHTML = services.map((s, i) => {
        const k = kindOf(s.url), off = s.status === 'inactive';
        return `<div class="row${off ? ' off' : ''}${editing === s.id ? ' on' : ''}" data-id="${s.id}" role="button" tabindex="0" style="--d:${Math.min(i, 10) * 45}ms">
          <span class="thumb">${imgs[i] ? `<img src="${imgs[i]}" alt="">` : ''}</span>
          <span class="info"><span class="nm">${esc(s.name)}</span>
            <span class="meta"><span class="kind ${k.cls}">${k.label}</span>${s.displayUrl ? `<span class="pill">${esc(s.displayUrl)}</span>` : ''}${off ? '<span class="pill off">停用</span>' : ''}<span class="url">${esc(s.url.replace(/^https?:\/\//, ''))}</span></span></span>
          <span class="acts">
            <button class="gl" data-a="up" aria-label="上移" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
            <button class="gl" data-a="down" aria-label="下移" ${i === services.length - 1 ? 'disabled' : ''}>${ICON.down}</button>
            <button class="gl" data-a="del" aria-label="删除">${ICON.del}</button></span></div>`;
      }).join('');
      if (enter) playEnter(list);
    }

    async function move(id, dir) {
      const i = services.findIndex(s => s.id === id), j = i + dir;
      if (j < 0 || j >= services.length) return;
      [services[i], services[j]] = [services[j], services[i]];
      renderList();
      try { await api('PUT', '/api/reorder', { ids: services.map(s => s.id) }); } catch (e) { toast(e.message, 'error'); }
    }
    async function remove(id) {
      const s = services.find(x => x.id === id);
      try { await api('DELETE', `/api/services/${id}`); } catch (e) { toast(e.message, 'error'); return; }
      services = services.filter(x => x.id !== id);
      if (editing === id) edit(null);
      renderList(); toast(`「${s.name}」已删除`);
    }

    document.addEventListener('click', e => {
      const row = e.target.closest('.row'); if (!row) return;
      const a = e.target.closest('[data-a]')?.dataset.a, id = row.dataset.id;
      if (a === 'up') return move(id, -1);
      if (a === 'down') return move(id, 1);
      if (a === 'del') return twoStep(e.target.closest('[data-a]'), '再按删除', () => remove(id));
      edit(id);
    });
    document.addEventListener('keydown', e => { const row = e.target.closest?.('.row'); if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); edit(row.dataset.id); } });

    /* ---- 表单：顶部是实时封面预览（同一个 shader），改名称 / 简介 / 意象 / 颜色立刻看到 ---- */
    function mountForm() {
      const f = $('#form');
      f.innerHTML = `<div class="preview"><canvas width="480" height="320"></canvas><div class="cap" id="cap"></div></div>
        <h3><span class="dot"></span><span id="fh"></span></h3>
        <div class="field"><label>名称<span class="req">*</span></label><input class="in" id="fName" placeholder="例如：Morii" /></div>
        <div class="field"><label>访问地址<span class="req">*</span></label><input class="in" id="fUrl" type="url" placeholder="https://…" /></div>
        <div class="two">
          <div class="field"><label>短标签</label><input class="in" id="fDisplayUrl" placeholder="如 V1.2.0" /></div>
          <div class="field"><label>标签</label><input class="in" id="fTags" placeholder="工具, 工作" /></div>
        </div>
        <div class="field"><label>简介</label><textarea class="in" id="fDesc" placeholder="一句话说明它是做什么的（也用来判断封面意象）"></textarea></div>
        <div class="field"><label>封面意象</label><div class="seg" id="fMotif">
          <button type="button" data-v="">自动</button>${Object.entries(MOTIFS).map(([k, m]) => `<button type="button" data-v="${k}">${m.word}</button>`).join('')}</div>
          <span class="hint" id="motifHint"></span></div>
        <div class="two">
          <div class="field"><label>高光色</label><div class="seg" id="fColor"><button type="button" data-v="auto">自动</button><button type="button" data-v="pick"><span class="sw" id="sw"></span><span id="hex">自选</span></button></div>
            <input class="color-in" id="colorIn" type="color" value="#38bdf8" /></div>
          <div class="field"><label>状态</label><div class="seg" id="fStatus"><button type="button" data-v="active">启用</button><button type="button" data-v="inactive">停用</button></div></div>
        </div>
        <div class="acts"><button class="btn p" id="save"></button><button class="btn g" id="cancel">取消</button></div>`;
      const cv = $('.preview canvas', f), L = liquid(cv);
      let P = null, previewT;
      const repaint = () => { if (!L) return; P = L.params(read()); };
      const schedule = () => { clearTimeout(previewT); previewT = setTimeout(() => { repaint(); caption(); }, PREVIEW_DEBOUNCE); };
      if (L) panelStop = loop((dt, now) => { if (P) L.draw(reduced ? 20 : now / 1000, P, P, 0); });
      const prevStop = panelStop; panelStop = () => { prevStop?.(); L?.dispose(); };

      function segSet(id, v) { $(`#${id}`).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
      function caption() {
        const s = read(), m = motifOf(s), k = kindOf(s.url);
        $('#cap').innerHTML = `<b>${esc(s.name || '未命名')}</b><span>${k.label} · ${m.word}</span>`;
        $('#motifHint').textContent = s.motif ? `手选：${m.why}` : `自动判断为「${m.word}」：${m.why}`;
      }
      form = {
        state: { ...EMPTY },
        fill(s) {
          this.state = { ...EMPTY, ...s, tags: [...(s.tags || [])] };
          $('#fName').value = this.state.name; $('#fUrl').value = this.state.url; $('#fDisplayUrl').value = this.state.displayUrl || '';
          $('#fTags').value = this.state.tags.join(', '); $('#fDesc').value = this.state.description || '';
          segSet('fMotif', this.state.motif || ''); segSet('fStatus', this.state.status || 'active');
          this.setColor(this.state.color || COLOR_AUTO);
          repaint(); caption();
        },
        setColor(c) {
          // 旧数据里的默认荧光绿等于「没选过」，显示成自动
          this.state.color = c && c.toLowerCase() !== '#c8ff00' ? c : COLOR_AUTO;
          const auto = !this.state.color;
          segSet('fColor', auto ? 'auto' : 'pick');
          $('#sw').style.background = auto ? 'conic-gradient(#38bdf8, #34d399, #818cf8, #38bdf8)' : this.state.color;
          $('#hex').textContent = auto ? '自选' : this.state.color;
        },
      };
      function read() {
        return { ...form.state, name: $('#fName').value.trim(), url: $('#fUrl').value.trim(), displayUrl: $('#fDisplayUrl').value.trim(),
          description: $('#fDesc').value.trim(), tags: $('#fTags').value.split(/[,，]/).map(t => t.trim()).filter(Boolean) };
      }
      f.addEventListener('input', e => { if (e.target.id === 'colorIn') { form.setColor(e.target.value); } schedule(); });
      f.addEventListener('click', e => {
        const b = e.target.closest('.seg button'); if (!b) return;
        const seg = b.parentElement.id, v = b.dataset.v;
        if (seg === 'fMotif') { form.state.motif = v; segSet('fMotif', v); }
        if (seg === 'fStatus') { form.state.status = v; segSet('fStatus', v); }
        if (seg === 'fColor') { if (v === 'auto') form.setColor(COLOR_AUTO); else { $('#colorIn').value = form.state.color || '#38bdf8'; $('#colorIn').click(); } }
        schedule();
      });
      $('#cancel').addEventListener('click', () => edit(null));
      $('#save').addEventListener('click', save);
      f.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') save(); });
    }

    function edit(id) {
      editing = id;
      const s = id ? services.find(x => x.id === id) : EMPTY;
      form.fill(s);
      $('#fh').textContent = id ? '编辑入口' : '新增入口';
      $('#save').textContent = id ? '保存修改' : '添加';
      $('#cancel').hidden = !id;
      document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.id === id));
      if (id && matchMedia('(max-width: 900px)').matches) $('#form').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
      if (!id) $('#fName').focus({ preventScroll: true });
    }

    async function save() {
      const s = { ...form.state, name: $('#fName').value.trim(), url: $('#fUrl').value.trim(), displayUrl: $('#fDisplayUrl').value.trim(),
        description: $('#fDesc').value.trim(), tags: $('#fTags').value.split(/[,，]/).map(t => t.trim()).filter(Boolean) };
      if (!s.name || !s.url) { toast('名称和访问地址都要填', 'error'); (s.name ? $('#fUrl') : $('#fName')).focus(); return; }
      const body = { name: s.name, url: s.url, displayUrl: s.displayUrl, description: s.description, tags: s.tags, motif: s.motif, color: s.color, status: s.status };
      $('#save').disabled = true;
      try {
        const data = editing ? await api('PUT', `/api/services/${editing}`, body) : await api('POST', '/api/services', body);
        if (editing) services = services.map(x => (x.id === data.id ? data : x)); else services = [...services, data];
        toast(editing ? `「${data.name}」已保存` : `「${data.name}」已添加`);
        renderList(); edit(data.id);
      } catch (e) { toast(e.message, 'error'); }
      finally { $('#save').disabled = false; }
    }

    /* ================= 启动 ================= */
    fetch(apiPath('/api/config')).then(r => r.json()).then(c => { if (c.title) { title = c.title; document.title = `${c.title} — 管理后台`; } })
      .finally(() => {
        if (!token) return showGate();
        api('GET', '/api/auth/check').then(() => showPanel(), () => showGate());
      });
  </script>
</body>
</html>

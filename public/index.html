<!DOCTYPE html>
<!--
  ooooxo.com 入口页：列出 /api/services 里的服务入口，点卡片打开，卡角一键复制链接；/#admin 全屏嵌入管理页。
  与同站 ReleaseHub 管理端同一套语言：暗色中性表面 + 天蓝强调、系统字体栈、Hrige 动效梯子（见 ReleaseHub ADR-0001/0002/0006）。
  纯静态，零依赖；由 server.js 以 express.static 提供。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>ooooxo</title>
  <style>
    :root {
      /* 表面按高度：地面 < 卡 < 浮起；中性不染色 */
      --bg: #0c0c0e;
      --surface: #161618;
      --surface2: #1e1e21;
      --inset: #25252a;
      --border: rgba(242, 243, 245, 0.08);
      --border-strong: rgba(242, 243, 245, 0.15);
      /* 墨阶 */
      --text: #f2f3f5;
      --text2: #9ba1ac;
      --text3: #5d646f;
      /* 强调：天蓝主 + 状态色 */
      --accent: #38bdf8;
      --accent-tint: rgba(56, 189, 248, 0.12);
      --green: #34d399;
      --amber: #fbbf24;
      --danger: #e8624f;
      --radius: 14px;
      --radius-sm: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei',
        'Noto Sans SC', system-ui, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
      /* 动效梯子（取自 Hrige tokens.css） */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-hover: cubic-bezier(0.4, 0, 0.2, 1);
      --spring-soft: cubic-bezier(0.22, 1.2, 0.36, 1);
      --t-press: 120ms;
      --t-fast: 160ms;
      --t-med: 220ms;
      --t-slow: 320ms;
      --stagger: 40ms;
      --shift: 8px;
      --pop: 0.96;
      --press: 0.98;
    }
    @media (prefers-reduced-motion: reduce) {
      :root { --spring-soft: var(--ease-out); --t-press: 1ms; --stagger: 0ms; --shift: 0px; --pop: 1; --press: 1; }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    /* 极淡的网格底：与 ReleaseHub 管理端同一张纸 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(236, 233, 227, 0.013) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 233, 227, 0.013) 1px, transparent 1px);
      background-size: 34px 34px;
      pointer-events: none;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    .wrap { position: relative; max-width: 1040px; margin: 0 auto; padding: 28px 24px 64px; }

    /* ── 顶栏：品牌在左，两枚纯字形按钮在右（hover 只动墨阶，不铺底） ── */
    .top { display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; border-radius: var(--radius-sm); }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--accent-tint); color: var(--accent);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
    .glyph {
      width: 36px; height: 36px; border: 0; background: none; border-radius: var(--radius-sm);
      display: grid; place-items: center; color: var(--text3); cursor: pointer;
      transition: color var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out);
    }
    .glyph:hover { color: var(--text); }
    .glyph:active { transform: scale(0.92); }
    .glyph svg { width: 18px; height: 18px; }
    .glyph.is-done { color: var(--green); }

    /* ── 标题：站名领头，计数作为一枚数据原子 ── */
    .head { margin: 56px 0 22px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .head-titles { margin-right: auto; }
    h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
    .count { margin-top: 8px; font-size: 0.82rem; color: var(--text2); }
    .count b { color: var(--text); font-weight: 650; }

    .search { position: relative; width: min(320px, 100%); }
    .search svg { position: absolute; left: 13px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
    .search input {
      width: 100%; padding: 10px 40px 10px 37px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font: inherit; font-size: 0.88rem;
      transition: border-color var(--t-fast) var(--ease-hover), box-shadow var(--t-fast) var(--ease-hover);
    }
    .search input::placeholder { color: var(--text3); }
    .search input:focus { outline: none; border-color: rgba(56, 189, 248, 0.45); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12); }
    .search kbd {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 0.7rem; color: var(--text3);
      border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 6px; line-height: 18px;
    }
    .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { opacity: 0; }

    /* ── 入口卡网格 ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 13px; }
    .card {
      position: relative; display: flex; flex-direction: column; min-height: 150px; padding: 16px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      transition: border-color var(--t-fast) var(--ease-hover), box-shadow var(--t-fast) var(--ease-hover),
        transform var(--t-press) var(--ease-out);
    }
    /* 只在首次载入时依次浮上；搜索筛选是原地换内容，不重放 */
    .grid.intro .card {
      animation: card-in var(--t-slow) var(--ease-out) both;
      animation-delay: calc(var(--i, 0) * var(--stagger));
    }
    .card:hover { border-color: var(--border-strong); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
    .card:active { transform: scale(var(--press)); }
    .card:has(.hit:focus-visible) { outline: 2px solid rgba(56, 189, 248, 0.6); outline-offset: 2px; }
    .card.is-off { opacity: 0.55; }
    /* 整卡可点：链接铺满卡面，卡角按钮叠在上面 */
    .hit { position: absolute; inset: 0; border-radius: inherit; z-index: 1; }
    .hit:focus-visible { outline: none; }
    .c-head { display: flex; align-items: flex-start; gap: 12px; }
    .mono-tile {
      flex: none; width: 40px; height: 40px; border-radius: 11px;
      display: grid; place-items: center;
      font-size: 1.05rem; font-weight: 750;
      color: var(--hue); background: color-mix(in srgb, var(--hue) 14%, transparent);
    }
    .mono-tile svg, .mono-tile img { width: 20px; height: 20px; }
    .c-titles { flex: 1; min-width: 0; }
    .c-name { display: block; font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .chip { font-size: 0.66rem; font-weight: 650; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; line-height: 1.5; background: var(--inset); color: var(--text2); }
    /* 类型胶囊：一类一色，与 ReleaseHub 的类型胶囊同义（应用天蓝 / 资源库绿 / 站点靛） */
    .chip.k-app { color: #38bdf8; background: rgba(56, 189, 248, 0.12); }
    .chip.k-res { color: #34d399; background: rgba(52, 211, 153, 0.12); }
    .chip.k-site { color: #818cf8; background: rgba(129, 140, 248, 0.13); }
    .chip.off { color: var(--amber); background: rgba(251, 191, 36, 0.12); }
    .c-copy { position: relative; z-index: 2; margin: -8px -8px 0 0; }
    .c-desc {
      margin: 12px 0 0; font-size: 0.82rem; color: var(--text2);
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .c-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 8px; }
    .c-host { flex: 1; min-width: 0; font-family: var(--mono); font-size: 0.7rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .c-go { flex: none; width: 16px; height: 16px; color: var(--text3); transition: color var(--t-fast) var(--ease-hover), transform var(--t-med) var(--ease-out); }
    .card:hover .c-go { color: var(--accent); transform: translateX(3px); }

    /* 载入中：骨架卡占住版面，数据到了原地换上 */
    .card.skel { animation: skel 1.1s ease-in-out infinite alternate; }
    .skel .bar { height: 10px; border-radius: 6px; background: var(--inset); }

    .state { grid-column: 1 / -1; padding: 48px 20px; text-align: center; color: var(--text2); font-size: 0.9rem; border: 1px dashed var(--border-strong); border-radius: var(--radius); }
    .state b { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }
    .state button, .state a { margin-top: 14px; display: inline-block; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: none; color: var(--text2); font-size: 0.82rem; cursor: pointer; }
    .state button:hover, .state a:hover { color: var(--text); }

    .foot { margin-top: 48px; font-size: 0.74rem; color: var(--text3); text-align: center; }

    #toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 50;
      padding: 10px 16px; border-radius: var(--radius-sm);
      background: var(--surface2); border: 1px solid var(--border-strong); color: var(--text); font-size: 0.85rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      opacity: 0; transform: translate(-50%, var(--shift)); pointer-events: none;
      transition: opacity var(--t-med) var(--ease-out), transform var(--t-med) var(--ease-out);
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 结果时刻：复制成功原地描勾 */
    .check path { stroke-dasharray: 24; animation: draw var(--t-slow) var(--ease-out) both; }
    .is-done svg { animation: pop var(--t-slow) var(--spring-soft); }

    @keyframes card-in { from { opacity: 0; transform: translateY(var(--shift)); } }
    @keyframes skel { to { opacity: 0.5; } }
    @keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(var(--pop)); } }

    #adminRoute { position: fixed; inset: 0; z-index: 100; background: var(--bg); }
    #adminRoute iframe { width: 100%; height: 100%; border: 0; }

    @media (max-width: 560px) {
      .wrap { padding: 20px 16px 48px; }
      .head { margin-top: 36px; }
      .search { width: 100%; }
      .search kbd { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="main">
    <header class="top">
      <a href="/" class="brand" aria-label="首页">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 15l8-5 8 5" opacity="0.45" /><path d="M4 10l8-5 8 5" /><circle cx="12" cy="18.5" r="1.8" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="brand-name">ooooxo</span>
      </a>
      <button type="button" class="glyph" id="btnShare" aria-label="复制本页链接" title="复制本页链接">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" /></svg>
      </button>
      <a href="#admin" class="glyph" aria-label="管理" title="管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z" /></svg>
      </a>
    </header>

    <section class="head">
      <div class="head-titles">
        <h1 id="siteTitle">入口</h1>
        <p class="count" id="count">&nbsp;</p>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input id="q" type="search" placeholder="搜索名称、简介、标签" autocomplete="off" aria-label="搜索入口" />
        <kbd>/</kbd>
      </label>
    </section>

    <main class="grid" id="grid" aria-live="polite"></main>
    <p class="foot">ooooxo.com</p>
  </div>

  <div id="toast" role="status"></div>
  <div id="adminRoute" hidden><iframe id="adminFrame" title="管理后台"></iframe></div>

  <script>
    /* ── 子路径前缀：Nginx 把本服务挂在 /home 之类的子路径时，API 跟着加前缀；根路径部署为空 ── */
    const PREFIX = (() => {
      const m = location.pathname.match(/^(\/[^/]+)/);
      return m && !/\.[a-z0-9]+$/i.test(m[1]) ? m[1] : '';
    })();
    const api = p => PREFIX + p;

    /* 管理页早期默认把每个入口都设成这个颜色；它等于「没选过」，按名字自动配色 */
    const LEGACY_DEFAULT_COLOR = '#c8ff00';
    /* 自动配色只在这几档里挑：与 ReleaseHub 的类型胶囊同一组色相 */
    const HUES = ['#38bdf8', '#818cf8', '#34d399', '#fbbf24', '#f472b6', '#2dd4bf'];

    const $ = id => document.getElementById(id);
    const grid = $('grid');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>';
    const ICON_CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>';
    const ICON_GO = '<svg class="c-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>';

    function hueOf(s) {
      if (s.color && s.color.toLowerCase() !== LEGACY_DEFAULT_COLOR) return s.color;
      let h = 0;
      for (const ch of s.name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
      return HUES[h % HUES.length];
    }
    /* 入口指向 ReleaseHub 的哪一类页面，就是什么类型；其余都算站点 */
    function kindOf(url) {
      if (/\/releasehub\/app\//.test(url)) return { cls: 'k-app', label: '应用' };
      if (/\/releasehub\/r\//.test(url)) return { cls: 'k-res', label: '资源库' };
      return { cls: 'k-site', label: '站点' };
    }
    function hostPath(url) {
      return String(url).replace(/^https?:\/\//, '').replace(/\/$/, '');
    }

    function cardHTML(s, i) {
      const off = s.status === 'inactive';
      const tag = (s.displayUrl || '').trim();
      const tile = s.icon ? s.icon : esc([...s.name.trim()][0] || '·');
      const kind = kindOf(s.url);
      const chips = [
        `<span class="chip ${kind.cls}">${kind.label}</span>`,
        tag && `<span class="chip">${esc(tag)}</span>`,
        ...(s.tags || []).map(t => `<span class="chip">${esc(t)}</span>`),
        off && '<span class="chip off">停用</span>',
      ].filter(Boolean).join('');
      return `
        <article class="card${off ? ' is-off' : ''}" style="--hue:${esc(hueOf(s))};--i:${i}">
          <a class="hit" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${esc(s.name)}"></a>
          <div class="c-head">
            <span class="mono-tile" aria-hidden="true">${tile}</span>
            <div class="c-titles">
              <span class="c-name">${esc(s.name)}</span>
              <div class="c-chips">${chips}</div>
            </div>
            <button type="button" class="glyph c-copy" data-url="${esc(s.url)}" aria-label="复制 ${esc(s.name)} 的链接" title="复制链接">${ICON_COPY}</button>
          </div>
          ${s.description ? `<p class="c-desc">${esc(s.description)}</p>` : ''}
          <div class="c-foot"><span class="c-host">${esc(hostPath(s.url))}</span>${ICON_GO}</div>
        </article>`;
    }

    let all = [];
    function render() {
      const q = $('q').value.trim().toLowerCase();
      const list = q
        ? all.filter(s => [s.name, s.description, s.displayUrl, s.url, ...(s.tags || [])].some(v => String(v || '').toLowerCase().includes(q)))
        : all;
      $('count').innerHTML = q ? `<b>${list.length}</b> / ${all.length} 个入口` : `<b>${all.length}</b> 个入口`;
      if (!all.length) {
        grid.innerHTML = '<div class="state"><b>还没有入口</b>在管理页添加第一个服务。<br><a href="#admin">去添加</a></div>';
      } else if (!list.length) {
        grid.innerHTML = `<div class="state"><b>没有匹配「${esc(q)}」的入口</b>换个关键词，或清空搜索。</div>`;
      } else {
        grid.innerHTML = list.map(cardHTML).join('');
      }
    }

    function showSkeleton() {
      grid.innerHTML = Array.from({ length: 6 }, (_, i) => `
        <div class="card skel" style="--i:${i}" aria-hidden="true">
          <div class="c-head"><span class="mono-tile" style="--hue:var(--text3)"></span>
            <div class="c-titles"><div class="bar" style="width:55%"></div><div class="bar" style="width:30%;margin-top:10px"></div></div></div>
          <div class="c-foot"><div class="bar" style="width:70%"></div></div>
        </div>`).join('');
    }

    async function load() {
      showSkeleton();
      try {
        const r = await fetch(api('/api/services'));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        all = await r.json();
        grid.classList.add('intro');
        render();
        setTimeout(() => grid.classList.remove('intro'), 800);
      } catch (e) {
        grid.innerHTML = `<div class="state"><b>入口列表没取到</b>${esc(e.message)}<br><button type="button" id="retry">重试</button></div>`;
        $('retry').onclick = load;
      }
    }

    fetch(api('/api/config'))
      .then(r => r.json())
      .then(c => { if (c.title) { $('siteTitle').textContent = c.title; document.title = c.title; } });

    /* ── 复制：成功在按钮上原地打勾；剪贴板不可用（http 直连）时退回 execCommand ── */
    let toastTimer;
    function toast(msg) {
      $('toast').textContent = msg;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
    }
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      if (!ok) throw new Error('copy failed');
    }
    async function copyFrom(btn, url) {
      try {
        await copyText(url);
      } catch {
        toast('复制失败，请手动复制');
        return;
      }
      const idle = btn.innerHTML;
      btn.innerHTML = ICON_CHECK;
      btn.classList.add('is-done');
      setTimeout(() => { btn.innerHTML = idle; btn.classList.remove('is-done'); }, 1400);
    }
    $('btnShare').addEventListener('click', e => copyFrom(e.currentTarget, location.origin + location.pathname));
    grid.addEventListener('click', e => {
      const btn = e.target.closest('.c-copy');
      if (btn && !btn.classList.contains('is-done')) copyFrom(btn, btn.dataset.url);
    });

    /* ── 搜索：输入即筛；「/」聚焦，Esc 清空 ── */
    $('q').addEventListener('input', render);
    $('q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; render(); e.target.blur(); } });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && !e.target.closest('input, textarea') && $('adminRoute').hidden) { e.preventDefault(); $('q').focus(); }
    });

    /* ── /#admin：全屏嵌入管理页，地址栏保持 /#admin ── */
    function applyHash() {
      const admin = location.hash === '#admin';
      $('adminRoute').hidden = !admin;
      $('main').toggleAttribute('inert', admin);
      document.body.style.overflow = admin ? 'hidden' : '';
      if (admin && !$('adminFrame').src) $('adminFrame').src = api('/admin.html?embed=1');
      if (!admin && $('adminFrame').src) load();
    }
    window.addEventListener('hashchange', applyHash);
    applyHash();
    load();
  </script>
</body>
</html>

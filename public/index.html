<!DOCTYPE html>
<!--
  ooooxo.com 入口页：单幅。一次讲一个入口，WebGL 实时液体大图 + 文字叠化。
  PC（宽屏 + 精确指针）：大图在右，缩略带 / 方向键切换；手机：大图在上，左右滑动切换——手指拖多少，液体就向相邻入口流多少，
  松手按速度决定切过去还是退回，用不过冲的阻尼弹簧落定（不弹）。
  每个入口的封面由同一个 shader 按内容生成：形态看内容（交换=对冲、日志=层流、资源=台阶、叩叩=波纹，管理页可手选），
  标题字形让液面在字里安静下来，同系列（Kero / Kero企业版）共用种子。设计稿与取舍：docs/lab/portal-ice.html。
  纯静态零依赖，由 server.js 的 express.static 提供；/#admin 全屏嵌入管理页。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>ooooxo</title>
  <style>
    :root {
      --night: #0c0c0e; --night-ink: #f2f3f5; --night-ink-2: #9ba1ac; --night-ink-3: #5d646f; --night-line: rgba(242, 243, 245, .09);
      --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
      --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
      /* 缓动按用途挑，从不线性：A→B 换内容用 in-out，出现消失用 out，悬停换色用 hover；手机手感用弹簧（脚本里） */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-hover: cubic-bezier(0.4, 0, 0.2, 1); --spring-soft: cubic-bezier(0.22, 1.2, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; background: var(--night); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .k-app { --kc: #38bdf8; } .k-res { --kc: #34d399; } .k-site { --kc: #818cf8; }
    .kdot::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: var(--kc); margin-right: 8px; vertical-align: 2px; }

    .brandrow { position: absolute; left: 0; right: 0; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 28px 40px; }
    .brandrow .wm { margin-right: auto; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
    .gl { width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; color: var(--ink-3);
      transition: color .16s var(--ease-hover), transform .32s var(--spring-soft); }
    .gl:hover { color: var(--ink); }
    .gl:active { transform: scale(.86); transition-duration: .08s; }
    .gl svg { width: 17px; height: 17px; }
    .gl.done { color: #34d399; }
    /* PC 的图标压在液体上：亮处会被吞，垫一层柔影让它在任何底上都看得见 */
    .pc .gl { color: var(--ink-2); filter: drop-shadow(0 0 6px rgba(0, 0, 0, .65)); }

    /* ================= PC：单幅 ================= */
    .pc { position: fixed; inset: 0; background: var(--night); color: var(--night-ink); --ink: var(--night-ink); --ink-2: var(--night-ink-2); --ink-3: var(--night-ink-3); }
    .pc .art { position: absolute; right: 0; top: 0; bottom: 0; width: 62%; overflow: hidden; }
    .pc .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* 遮罩从一段实底起、往左多盖 2px：画布左缘落在小数像素上会抗锯齿出一道亮线 */
    .pc .art::after { content: ''; position: absolute; inset: 0 0 0 -2px; pointer-events: none;
      background: linear-gradient(90deg, var(--night) 0%, var(--night) 3%, rgba(12, 12, 14, 0) 32%); }
    .pc .side { position: absolute; left: 6%; top: 0; bottom: 0; width: 38%; z-index: 5; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
    .pc .txt { display: grid; }
    .pc .sl { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 18px;
      transition: opacity .45s var(--ease-in-out), transform .45s var(--ease-in-out), filter .45s var(--ease-in-out); }
    .pc .sl.in { opacity: 0; transform: translateY(12px); filter: blur(6px); }
    .pc .sl.out { opacity: 0; transform: translateY(-10px); filter: blur(6px); pointer-events: none; }
    .pc .count { font-size: 14px; color: var(--ink-3); }
    .pc .count b { color: var(--ink); font-weight: 500; }
    .pc h1 { margin: 0; font-size: clamp(48px, 5.8vw, 92px); line-height: 1.02; font-weight: 650; letter-spacing: -0.045em; }
    .pc .desc { font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 420px; min-height: 26px; }
    /* 右上角胶囊：类型 / 短标签 / 标签 / 停用，挂在分享与管理图标下方、右对齐 */
    .pc .tags { position: absolute; right: 40px; top: 82px; z-index: 20; max-width: 46%; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
      transition: opacity .2s var(--ease-out); }
    .pc .tags.out { opacity: 0; }
    .pc.mobile .tags { right: 18px; top: calc(env(safe-area-inset-top) + 60px); max-width: 70%; }
    .pc .chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(12, 12, 14, .55); color: var(--ink-2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .pc .chip.k { color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent); }
    .pc .chip.off { color: #fbbf24; background: rgba(251, 191, 36, .12); }
    .pc .acts { display: flex; gap: 10px; }
    .pc .btn { height: 44px; padding: 0 20px; border-radius: 22px; border: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .16s var(--ease-hover), color .16s var(--ease-hover), transform .12s var(--ease-out), opacity .16s var(--ease-hover); }
    .pc .btn:active { transform: scale(.97); }
    .pc .btn.p { background: var(--ink); color: var(--night); }
    .pc .btn.p[aria-disabled="true"] { opacity: .35; pointer-events: none; }
    .pc .btn.g { background: rgba(255, 255, 255, .06); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--night-line); }
    .pc .btn.g:hover { color: var(--ink); }
    .pc .btn svg { width: 14px; height: 14px; }
    .pc .strip { position: absolute; left: 6%; right: 6%; bottom: 32px; z-index: 6; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px; }
    .pc .strip::-webkit-scrollbar { display: none; }
    .pc .th { flex: none; width: 76px; height: 50px; border-radius: 6px; overflow: hidden; opacity: .4; cursor: pointer; border: 0; padding: 0; background: #1a1a1d;
      outline: 1px solid transparent; outline-offset: 3px; transition: opacity .16s var(--ease-hover), outline-color .16s var(--ease-hover); }
    .pc .th:hover { opacity: .8; }
    .pc .th.on { opacity: 1; outline-color: rgba(255, 255, 255, .6); }
    .pc .th img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 进入过渡：液体从黑里浮现、轻微收拢；文字、按钮、缩略带 / 页码依次浮入。出现用 ease-out，液体浮现是 A→B 用 in-out */
    .pc .art { transition: opacity 1.6s var(--ease-in-out), transform 2.2s var(--ease-out); }
    .pc.enter .art { opacity: 0; transform: scale(1.06); }
    .pc .brandrow, .pc .tags, .pc .txt, .pc .acts, .pc .strip, .pc .pager { transition: opacity .8s var(--ease-out) var(--d, 0ms), transform .8s var(--ease-out) var(--d, 0ms), filter .8s var(--ease-out) var(--d, 0ms); }
    .pc.enter .brandrow, .pc.enter .tags, .pc.enter .txt, .pc.enter .acts, .pc.enter .strip, .pc.enter .pager { opacity: 0; transform: translateY(18px); filter: blur(6px); }
    .pc .brandrow { --d: 200ms; } .pc .tags { --d: 300ms; } .pc .txt { --d: 350ms; } .pc .acts { --d: 520ms; } .pc .strip, .pc .pager { --d: 700ms; }

    /* ================= 手机：同一套单幅，竖排 ================= */
    /* 高度沿用 fixed + inset:0，即浏览器实际可见区。不用 100dvh：老内核（国产手机浏览器）不认 dvh，回落到 100vh = 收起工具栏时的高度，底部按钮会被压到栏下 */
    .pc.mobile { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .pc.mobile .brandrow { padding: calc(env(safe-area-inset-top) + 14px) 12px 0 22px; }
    .pc.mobile .art { width: 100%; height: 62%; bottom: auto; }
    .pc.mobile .art::after { inset: 0; background: linear-gradient(180deg, rgba(12, 12, 14, 0) 40%, var(--night) 98%); }
    .pc.mobile .side { left: 22px; right: 22px; width: auto; top: auto; bottom: calc(env(safe-area-inset-bottom) + 40px); justify-content: flex-end; gap: 18px; }
    .pc.mobile .sl { gap: 14px; }
    .pc.mobile h1 { font-size: clamp(34px, 10vw, 46px); }
    .pc.mobile .desc { font-size: 15px; min-height: 0; }
    .pc.mobile .acts .btn { flex: 1; justify-content: center; }
    /* 左右滑的方向感：新内容从手指来的那一侧进，旧内容往另一侧走 */
    .pc.mobile .sl.in { transform: translateX(var(--dx, 24px)); }
    .pc.mobile .sl.out { transform: translateX(calc(var(--dx, 24px) * -1)); }
    .pc.mobile .txt.dragging .sl { transition: none; }
    /* 手机叠化不用模糊：大字号文字套 blur 在手机上很贵，是切换时掉帧的来源之一 */
    .pc.mobile .sl { transition: opacity .4s var(--ease-in-out), transform .4s var(--ease-in-out); }
    .pc.mobile .sl.in, .pc.mobile .sl.out { filter: none; }
    .pc .pager { display: flex; gap: 6px; padding-left: 2px; }
    .pc .pager i { width: 5px; height: 5px; border-radius: 9px; background: var(--ink); opacity: .22; transition: opacity .3s var(--ease-in-out), width .3s var(--ease-in-out); }
    .pc .pager i.on { opacity: .9; width: 18px; }

    /* ================= 共用：状态、提示、管理页 ================= */
    .state { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 15px; line-height: 1.7; z-index: 30; background: var(--night); color: var(--night-ink); }
    .state b { display: block; font-size: 17px; margin-bottom: 4px; }
    .state button, .state a { margin-top: 14px; display: inline-block; padding: 8px 16px; border-radius: 20px; border: 1px solid currentColor; background: none; cursor: pointer; opacity: .7; }
    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); z-index: 200; padding: 10px 16px; border-radius: 10px; background: #1e1e21; color: #f2f3f5; font-size: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .4); opacity: 0; transform: translate(-50%, 8px); pointer-events: none; transition: opacity .22s var(--ease-out), transform .22s var(--ease-out); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #adminRoute { position: fixed; inset: 0; z-index: 300; background: var(--night); }
    #adminRoute iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" role="status"></div>
  <div id="adminRoute" hidden><iframe id="adminFrame" title="管理后台"></iframe></div>

  <script src="liquid.js"></script>
  <script>
    const { kindOf, EASE_IN_OUT, spring, loop, liquid, covers } = window.HP;
    /* ---- 可调参数（封面关联方式在 liquid.js 的 COVER_MODE） ---- */
    const MOBILE_QUERY = '(max-width: 760px), (pointer: coarse) and (max-width: 1100px)';
    const LIQUID_RES = 0.6;          // 液体画布分辨率（相对 CSS 像素）：液体本身就柔，0.6 足够且省电
    const MOBILE_RES = 0.4;          // 手机再降一档：切换时要同时算两个入口，手机 GPU 吃不消全分辨率
    const MOBILE_DPR_CAP = 1.25;     // 手机像素比上限（3x 屏按 1.25 算）
    const MIX_MS = 1200;             // 液体换幅时长；文字叠化 0.45s（CSS），先换字、液体再流过去
    const SWIPE_SPAN = 0.85;         // 手机：手指横拖这么多屏宽 = 液体完全流到下一个入口
    const SWIPE_COMMIT = 0.25;       // 松手时（含速度投射）超过这么多屏宽就切过去，否则退回
    const SETTLE = (2 * Math.PI / 0.42) ** 2;   // 落定弹簧刚度（response 0.42s），阻尼比 1：不过冲、不弹

    /* 子路径前缀：Nginx 把本服务挂在 /home 之类时 API 跟着加前缀；根路径部署为空 */
    const PREFIX = (() => { const m = location.pathname.match(/^(\/[^/]+)/); return m && !/\.[a-z0-9]+$/i.test(m[1]) ? m[1] : ''; })();
    const api = p => PREFIX + p;
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const no = i => String(i + 1).padStart(2, '0');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const GL = {
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
      gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
    };

    /* ---- 复制与提示 ---- */
    let toastTimer;
    function toast(msg) { $('#toast').textContent = msg; $('#toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 2000); }
    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      const ta = Object.assign(document.createElement('textarea'), { value: text }); ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
      if (!ok) throw new Error('copy failed');
    }
    function copyWithTick(btn, text, label) {
      copyText(text).then(() => {
        const idle = btn.innerHTML; btn.innerHTML = label ? GL.check + label : GL.check; btn.classList.add('done');
        setTimeout(() => { btn.innerHTML = idle; btn.classList.remove('done'); }, 1400);
      }, () => toast('复制失败，请手动复制'));
    }
    /* 进入过渡：先挂 enter（全部处于起点），落一帧样式后摘掉，让各自的过渡跑起来；减少动态效果时不做 */
    function playEnter(el) {
      if (reduced) return;
      el.classList.add('enter');
      void el.offsetWidth;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
    }
    let entered = false;   // 只在第一次进页时播；从管理页回来重排不重播
    const brand = () => `<div class="brandrow"><span class="wm">ooooxo</span><button class="gl" data-act="share" aria-label="复制本页链接">${GL.link}</button><a class="gl" href="#admin" aria-label="管理">${GL.gear}</a></div>`;

    /* ================= 单幅（PC 与手机共用） ================= */
    function mountStage(list, mobile) {
      $('#root').innerHTML = `<div class="pc${mobile ? ' mobile' : ''}">${brand()}<div class="tags" id="tg"></div><div class="art"><canvas></canvas></div>
        <div class="side"><div class="txt" id="tx"></div><div class="acts"><a class="btn p" id="go" ${mobile ? '' : 'target="_blank" rel="noopener noreferrer"'}>打开 ${GL.arrow}</a><button class="btn g" id="cp">复制链接</button></div>${mobile ? `<div class="pager">${list.map(() => '<i></i>').join('')}</div>` : ''}</div>
        ${mobile ? ''
                 : `<nav class="strip" aria-label="全部入口">${list.map((s, i) => `<button class="th" data-i="${i}" aria-label="${esc(s.name)}"><img alt=""></button>`).join('')}</nav>`}</div>`;
      const root = $('.pc'), cv = root.querySelector('canvas'), art = root.querySelector('.art'), tx = root.querySelector('#tx');
      if (!entered) playEnter(root);
      const fit = () => { const k = mobile ? Math.min(devicePixelRatio || 1, MOBILE_DPR_CAP) * MOBILE_RES : Math.min(devicePixelRatio || 1, 1.5) * LIQUID_RES; cv.width = Math.round(art.clientWidth * k); cv.height = Math.round(art.clientHeight * k); };
      fit();
      const L = liquid(cv, false, mobile);
      if (!L) console.error('WebGL 不可用：大图不渲染，入口照常可用');
      if (!mobile) covers(list).forEach((src, i) => { if (src) root.querySelectorAll('.th img')[i].src = src; });
      const P = [];                                       // 各入口的 shader 参数，按需算
      const par = i => (P[i] ||= L.params(list[i]));
      const wrap = i => (i + list.length) % list.length;

      /* 液体：A 是当前，B 是要去的；mix 0→1 从 A 流到 B。PC 按时间补间（ease-in-out），手机由手指 / 阻尼弹簧驱动 */
      let A = L ? par(0) : null, B = A, mix = 0, tween = null, cur = -1;
      function flowTo(i) { if (!L) return; if (tween || mix > 0) A = B; B = par(i); mix = 0; tween = { t0: performance.now() }; }

      /* 文字：叠化换层（PC 上下，手机按滑动方向左右） */
      function text(i, dir = 1) {
        const s = list[i], k = kindOf(s.url), first = cur < 0, off = s.status === 'inactive';
        cur = i;
        // 右上角胶囊：先淡出、换内容、再淡入
        const tg = root.querySelector('#tg'), chips = `<span class="chip k ${k.cls}">${k.label}</span>${s.displayUrl ? `<span class="chip">${esc(s.displayUrl)}</span>` : ''}${(s.tags || []).map(t => `<span class="chip">${esc(t)}</span>`).join('')}${off ? '<span class="chip off">停用</span>' : ''}`;
        if (first) tg.innerHTML = chips; else { tg.classList.add('out'); clearTimeout(tg._t); tg._t = setTimeout(() => { tg.innerHTML = chips; tg.classList.remove('out'); }, 200); }
        const sl = document.createElement('div');
        sl.className = 'sl' + (first ? '' : ' in');
        sl.style.setProperty('--dx', `${dir * 26}px`);
        sl.innerHTML = `<div class="count num"><b>${no(i)}</b> / ${no(list.length - 1)}</div><h1>${esc(s.name)}</h1>${s.description ? `<div class="desc">${esc(s.description)}</div>` : (mobile ? '' : '<div class="desc"></div>')}`
          ;
        tx.querySelectorAll('.sl:not(.out)').forEach(o => { o.style.transform = ''; o.style.opacity = ''; o.style.setProperty('--dx', `${dir * 26}px`); o.classList.add('out'); setTimeout(() => o.remove(), 500); });
        tx.appendChild(sl);
        if (!first) requestAnimationFrame(() => requestAnimationFrame(() => sl.classList.remove('in')));
        const go = root.querySelector('#go'); go.href = s.url; go.setAttribute('aria-disabled', String(off));
        if (mobile) root.querySelectorAll('.pager i').forEach((d, j) => d.classList.toggle('on', j === i));
        else root.querySelectorAll('.th').forEach((t, j) => { t.classList.toggle('on', j === i); if (j === i) t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
      }
      function show(i, dir) { if (i === cur) return; flowTo(i); text(i, dir); }

      root.addEventListener('click', e => {
        const t = e.target.closest('.th'); if (t) return show(Number(t.dataset.i), 1);
        if (e.target.closest('#cp')) copyWithTick(e.target.closest('#cp'), list[cur].url, '已复制');
        const sh = e.target.closest('[data-act="share"]'); if (sh) copyWithTick(sh, location.origin + location.pathname);
      });
      let hoverT;
      if (!mobile) root.addEventListener('pointerover', e => { const t = e.target.closest('.th'); if (t) { clearTimeout(hoverT); hoverT = setTimeout(() => show(Number(t.dataset.i), 1), 60); } });
      const onKey = e => {
        if (!$('#adminRoute').hidden) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') show(wrap(cur + 1), 1);
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') show(wrap(cur - 1), -1);
      };
      addEventListener('keydown', onKey);

      /* ---- 手机：左右滑。拖时液体与文字 1:1 跟手；松手按速度投射决定切 / 退，阻尼比 1 的弹簧接力松手速度落定，不过冲 ---- */
      const settle = { x: 0, v: 0 }; let settleTo = null, swipe = null, swipeTarget = -1;
      if (mobile) {
        const W = () => root.clientWidth;
        root.addEventListener('pointerdown', e => {
          if (e.target.closest('.brandrow, .acts')) return;
          if (settleTo !== null) { if (settleTo === 1) A = B; mix = 0; settleTo = null; }   // 落定途中又按下：直接落定再接手
          swipe = { x0: e.clientX, y0: e.clientY, lock: null, samples: [], id: e.pointerId };
        });
        root.addEventListener('pointermove', e => {
          if (!swipe || e.pointerId !== swipe.id) return;
          const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
          if (swipe.lock === null) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            swipe.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            if (swipe.lock === 'x') { root.setPointerCapture(e.pointerId); tx.classList.add('dragging'); }
          }
          if (swipe.lock !== 'x') return;
          const dir = dx < 0 ? 1 : -1, target = wrap(cur + dir);   // 往左拖 = 下一个
          if (target !== swipeTarget) { swipeTarget = target; if (L) B = par(target); }
          swipe.dir = dir;
          const p = Math.min(1, Math.abs(dx) / (W() * SWIPE_SPAN));
          mix = p; tween = null;
          const curSl = tx.querySelector('.sl:not(.out)');
          if (curSl) { curSl.style.transform = `translateX(${dx * 0.35}px)`; curSl.style.opacity = String(1 - p * 0.85); }
          const t = performance.now(); swipe.samples.push({ t, dx }); while (swipe.samples.length > 2 && t - swipe.samples[0].t > 100) swipe.samples.shift();
        });
        const up = e => {
          if (!swipe || e.pointerId !== swipe.id) return;
          const st = swipe; swipe = null; tx.classList.remove('dragging');
          if (st.lock !== 'x') return;
          const a = st.samples[0], b = st.samples.at(-1);
          const v = a && b && b.t > a.t && performance.now() - b.t < 80 ? (b.dx - a.dx) / ((b.t - a.t) / 1000) : 0;   // 手指横向速度 px/s
          const projected = (b?.dx ?? 0) + v * 0.18;
          const commit = Math.abs(projected) > W() * SWIPE_COMMIT && Math.sign(projected) === -st.dir;
          settle.x = mix; settle.v = (-st.dir * v) / (W() * SWIPE_SPAN);   // 速度接力：mix 的变化率 = 手指速度 / 满程宽度
          settleTo = commit ? 1 : 0;
          if (commit) text(swipeTarget, st.dir);
          else { const curSl = tx.querySelector('.sl:not(.out)'); if (curSl) { curSl.style.transform = ''; curSl.style.opacity = ''; } }
        };
        root.addEventListener('pointerup', up); root.addEventListener('pointercancel', up);
      }

      const ro = new ResizeObserver(fit); ro.observe(art);
      text(0, 1);
      // 首屏出来后趁空闲把每个入口的参数（含字形纹理）都备好：滑到哪个都不用现算
      if (L) { const idle = window.requestIdleCallback || (f => setTimeout(f, 60)); let k = 1; const warm = () => { if (k < list.length) { par(k++); idle(warm); } }; idle(warm); }
      const stop = L ? loop((dt, now) => {
        if (!$('#adminRoute').hidden) return;
        let m = mix;
        if (tween) { const t = Math.min(1, (now - tween.t0) / MIX_MS); m = EASE_IN_OUT(t); if (t >= 1) { A = B; mix = 0; m = 0; tween = null; } }
        if (settleTo !== null) {
          spring(settle, settleTo, SETTLE, 1, dt); m = Math.max(0, Math.min(1, settle.x));
          if (Math.abs(settle.x - settleTo) < 0.003 && Math.abs(settle.v) < 0.02) { if (settleTo === 1) A = B; mix = 0; m = 0; settleTo = null; swipeTarget = -1; }
          else mix = m;
        }
        L.draw(reduced ? 20 : now / 1000, A, B, m);
      }) : () => {};
      return () => { stop(); ro.disconnect(); removeEventListener('keydown', onKey); L?.dispose(); };
    }

    /* ================= 装配 ================= */
    let services = [], unmount = null;
    const mq = matchMedia(MOBILE_QUERY);
    function render() {
      unmount?.(); unmount = null;
      if (!services.length) {
        $('#root').innerHTML = '<div class="state"><div><b>还没有入口</b>在管理页添加第一个服务。<br><a href="#admin">去添加</a></div></div>';
        return;
      }
      unmount = mountStage(services, mq.matches);
      entered = true;
    }
    async function load() {
      try {
        const r = await fetch(api('/api/services'));
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        services = await r.json();
        render();
      } catch (e) {
        $('#root').innerHTML = `<div class="state"><div><b>入口列表没取到</b>${esc(e.message)}<br><button type="button" id="retry">重试</button></div></div>`;
        $('#retry').onclick = load;
      }
    }
    mq.addEventListener('change', render);
    fetch(api('/api/config')).then(r => r.json()).then(c => { if (c.title) document.title = c.title; });

    /* /#admin：全屏嵌入管理页，地址栏保持 /#admin；关掉回来时重新拉一遍入口（管理页可能改过） */
    function applyHash() {
      const admin = location.hash === '#admin';
      $('#adminRoute').hidden = !admin;
      $('#root').toggleAttribute('inert', admin);
      if (admin && !$('#adminFrame').src) $('#adminFrame').src = api('/admin.html?embed=1');
      if (!admin && $('#adminFrame').src) load();
    }
    addEventListener('hashchange', applyHash);
    applyHash();
    load();
  </script>
</body>
</html>

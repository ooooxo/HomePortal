<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对照版 · 入口页「更高级」</title>
<!--
  干什么：ooooxo.com 入口页的多档对照。参考 MegD1/Ice-works-showcase 的编辑式排版与「作品即界面」，但不搬它的图片与商业字体。
         第 0 档 = 现状（public/index.html 原样内嵌）；1–6 档各是一套完整整页方案。
         已经定下、每档都遵守的：入口数据与行为不变（点开 / 复制链接 / 管理入口）；每个入口一张按名字生成的专属肌理图；系统字体栈、不引外部字体与 CDN。
  怎么跑：python3 docs/lab/build.py 生成 portal-ice.html（把现行 index.html 内嵌进来），然后 open 它。
         数字切档 · C 与现状来回对照 · S 换样本（稀 / 中 / 满）· R 换轮次 · P 重播。
  需要什么：只需浏览器；1–6 档的交互在缩放后的整页画布里同样可用（滚轮 / 拖拽 / 悬停）。
-->
<style>
/* ---- 可调参数 ---------------------------------------------------------- */
:root {
  --screen-w: 1440px;   /* 被比较的整页按这个视口画，再整体缩放进舞台 */
  --screen-h: 880px;
  /* 实验台自己的色（不是被比较的东西） */
  --lab-bg: #e9e9ec; --lab-ink: #18181b; --lab-ink-3: #71717a; --lab-ink-4: #a1a1aa; --lab-chip: rgba(0,0,0,.06);
  --lab-accent: #0284c7; --lab-warn: #b45309;
  --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
  /* 被比较的方案共用的两套纸：参考站的近白纸 + 墨，与 ReleaseHub 的暗面 */
  --paper: #f7f7f5; --paper-ink: #0b0b0c; --paper-ink-2: #55555c; --paper-ink-3: #a3a3aa; --paper-line: rgba(11,11,12,.1);
  --night: #0c0c0e; --night-ink: #f2f3f5; --night-ink-2: #9ba1ac; --night-ink-3: #5d646f; --night-line: rgba(242,243,245,.09);
  --sky: #38bdf8;
  /* 缓动按用途挑，从不线性：A→B 换内容 / 换位用 in-out，出现消失用 out，悬停换色用 hover，手机手感用弹簧 */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --ease-hover: cubic-bezier(0.4, 0, 0.2, 1); --spring-soft: cubic-bezier(0.22, 1.2, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); background: var(--lab-bg); color: var(--lab-ink); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* ================= 实验台 ================= */
.lab { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 14px 24px 10px; }
.lab-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lab h1 { margin: 0; font-size: 15px; font-weight: 650; white-space: nowrap; }
.pick { display: flex; flex-wrap: wrap; gap: 2px; }
.pick button { height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: none; font-size: 13px; color: var(--lab-ink-3); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.pick button b { font-family: var(--mono); font-weight: 450; color: var(--lab-ink-4); }
.pick button:hover { background: var(--lab-chip); color: var(--lab-ink); }
.pick button[aria-pressed="true"] { color: var(--lab-ink); font-weight: 650; }
.pick button[aria-pressed="true"] b { color: var(--lab-accent); }
.lab-sep { width: 1px; height: 14px; margin: 0 6px; background: rgba(0,0,0,.15); align-self: center; }
.lab-sp { flex: 1; }
.keys { font-size: 12px; color: var(--lab-ink-4); white-space: nowrap; }
.keys kbd { font-family: var(--mono); padding: 0 4px; border-radius: 4px; background: var(--lab-chip); color: var(--lab-ink-3); }
.lab-note { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 22px; }
.thesis { font-size: 14px; font-weight: 650; margin-right: 4px; }
.part { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--lab-chip); font-size: 12px; color: #3f3f46; }
.part i { font-style: normal; color: var(--lab-ink-4); }
.cost { font-size: 12px; color: var(--lab-warn); }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 4px 24px 20px; }
.frame { position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08); background: #000; }
.frame.bare { overflow: visible; border-radius: 0; box-shadow: none; background: none; }
.frame.bare .dev.pc { box-shadow: 0 20px 60px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08); }
.screen { position: absolute; left: 0; top: 0; width: var(--screen-w); height: var(--screen-h); transform-origin: 0 0; overflow: hidden; }
.screen iframe { width: 100%; height: 100%; border: 0; display: block; }
.lab-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 14px; border-radius: 9px; background: #18181b; color: #fff; font-size: 13px; opacity: 0; transition: opacity .2s var(--ease-out); pointer-events: none; z-index: 9; }
.lab-toast.show { opacity: 1; }

/* ================= 被比较的方案共用的零件 ================= */
.pg { position: absolute; inset: 0; font-family: var(--font); -webkit-font-smoothing: antialiased; user-select: none; }
.pg.paper { background: var(--paper); color: var(--paper-ink); --ink: var(--paper-ink); --ink-2: var(--paper-ink-2); --ink-3: var(--paper-ink-3); --line: var(--paper-line); }
.pg.night { background: var(--night); color: var(--night-ink); --ink: var(--night-ink); --ink-2: var(--night-ink-2); --ink-3: var(--night-ink-3); --line: var(--night-line); }
.pg a { color: inherit; text-decoration: none; }
.art { display: block; width: 100%; height: 100%; object-fit: cover; }
.brandrow { position: absolute; left: 48px; right: 48px; top: 32px; display: flex; align-items: center; gap: 14px; z-index: 5; font-size: 14px; }
.brandrow .wm { font-weight: 700; letter-spacing: -0.01em; }
.brandrow .sub { color: var(--ink-3); }
.brandrow .sp { flex: 1; }
.brandrow .gl { width: 34px; height: 34px; display: grid; place-items: center; color: var(--ink-3); border: 0; background: none; cursor: pointer; }
.brandrow .gl:hover { color: var(--ink); }
.brandrow .gl svg { width: 17px; height: 17px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.k-app { --kc: #0ea5e9; } .k-res { --kc: #10b981; } .k-site { --kc: #6366f1; }
.night .k-app { --kc: #38bdf8; } .night .k-res { --kc: #34d399; } .night .k-site { --kc: #818cf8; }
.kdot::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 99px; background: var(--kc); margin-right: 8px; vertical-align: 2px; }
.tagpill { position: absolute; z-index: 20; pointer-events: none; height: 40px; padding: 0 16px; border-radius: 20px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #fff; background: rgba(11,11,12,.55); backdrop-filter: blur(10px) saturate(1.4); -webkit-backdrop-filter: blur(10px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: opacity .2s var(--ease-out), transform .25s var(--ease-out); }
.tagpill.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---- 第二轮：PC 与手机并排 ---- */
.duo { position: absolute; inset: 0; display: flex; align-items: center; gap: 70px; }
.dev { position: relative; flex: none; overflow: hidden; }
.dev.pc { width: 1440px; height: 880px; border-radius: 10px; }
.dev.phone { width: 390px; height: 844px; border-radius: 46px; box-shadow: 0 0 0 11px #1c1c1f, 0 0 0 12px #3a3a3f; }
.v3 .art-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.v3 .txt { display: grid; }
.v3 .txt .sl { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 18px; transition: opacity .45s var(--ease-in-out), transform .45s var(--ease-in-out), filter .45s var(--ease-in-out); }
.v3 .txt .sl.in { opacity: 0; transform: translateY(12px); filter: blur(6px); }
.v3 .txt .sl.out { opacity: 0; transform: translateY(-10px); filter: blur(6px); pointer-events: none; }
.v3 .motif { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.v3 .motif b { font-weight: 500; color: var(--ink-2); }
.rp .gl { transition: transform .32s var(--spring-soft), color .2s var(--ease-hover); }
.rp .gl:active { transform: scale(.84); transition-duration: .08s; }
.rp .brandrow { left: 0; right: 0; top: 0; padding: 50px 14px 34px 22px; z-index: 150; background: linear-gradient(var(--paper) 55%, rgba(247,247,245,0)); }
.rp .card { position: absolute; left: 0; top: 0; width: 250px; height: 167px; margin: -83.5px 0 0 -125px; border-radius: 8px; overflow: hidden; will-change: transform; }
.rp .card.dim .art { filter: brightness(.86); }
/* 底部信息区是一片纸：卡片从它底下转过去，名字永远不被盖住 */
.rp .meta { position: absolute; left: 0; right: 0; bottom: 0; z-index: 150; display: flex; flex-direction: column; gap: 8px; padding: 70px 22px 44px; background: linear-gradient(rgba(247,247,245,0), var(--paper) 42%); }
.rp .meta .row1 { display: flex; align-items: baseline; gap: 14px; }
.rp .meta .num { font-size: 13px; color: var(--ink-3); }
.rp .meta .nm { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
.rp .meta .row2 { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); padding-left: 1px; }
.rp .meta .swap { display: inline-block; transition: filter .45s var(--ease-in-out), opacity .45s var(--ease-in-out); }
.rp .meta .swap.out { filter: blur(8px); opacity: 0; }
.rp .hint { position: absolute; left: 22px; bottom: 16px; font-size: 11px; color: var(--ink-3); z-index: 151; }
.rp .dots { position: absolute; right: 16px; top: 40%; transform: translateY(-50%); z-index: 151; display: flex; flex-direction: column; gap: 6px; }
.rp .dots i { width: 4px; height: 4px; border-radius: 9px; background: var(--ink); opacity: .18; transition: opacity .3s var(--ease-in-out), height .3s var(--ease-in-out); }
.rp .dots i.on { opacity: .9; height: 14px; }

/* ---- 1 环 ---- */
.v1 .ring { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.v1 .card { position: absolute; left: 0; top: 0; width: 400px; height: 267px; margin: -133.5px 0 0 -200px; border-radius: 10px; overflow: hidden; cursor: pointer; will-change: transform; box-shadow: 0 0 0 1px rgba(0,0,0,.04); }
.v1 .card .art { transition: filter .3s var(--ease-hover); }
.v1 .card.dim .art { filter: brightness(.86) saturate(.8); }
.v1 .metaL, .v1 .metaR { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: baseline; gap: 4.7vw; z-index: 4; font-size: 24px; letter-spacing: -0.01em; }
.v1 .metaL { left: 5.5%; gap: 60px; } .v1 .metaR { right: 5.5%; gap: 52px; }
.v1 .metaL .num, .v1 .metaR .num { font-size: 16px; }
.v1 .metaL .nm { font-size: 30px; font-weight: 500; max-width: 300px; }
.v1 .swap { display: inline-block; transition: filter .45s var(--ease-in-out), opacity .45s var(--ease-in-out); }
.v1 .swap.out { filter: blur(8px); opacity: 0; }
/* 索引是一扇固定高的窗：条目多时跟着当前项滚，永远停在右侧信息上方，不和它撞 */
.v1 .index { position: absolute; right: 12%; top: 92px; z-index: 4; height: 220px; overflow: hidden; font-size: 13px; line-height: 1.4; mask: linear-gradient(transparent, #000 14%, #000 86%, transparent); -webkit-mask: linear-gradient(transparent, #000 14%, #000 86%, transparent); }
.v1 .index .rail { display: flex; flex-direction: column; gap: 3px; padding: 26px 0; transition: transform .5s var(--ease-in-out); }
.v1 .index span { opacity: .22; } .v1 .index span.on { opacity: 1; }
.v1 .hint { position: absolute; left: 48px; bottom: 30px; z-index: 4; font-size: 12px; color: var(--ink-3); }
.v1 .glass { position: absolute; left: 0; right: 0; height: 8%; z-index: 3; pointer-events: none; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.v1 .glass.t { top: 0; mask: linear-gradient(#000, transparent); -webkit-mask: linear-gradient(#000, transparent); }
.v1 .glass.b { bottom: 0; mask: linear-gradient(transparent, #000); -webkit-mask: linear-gradient(transparent, #000); }

/* ---- 2 索引 ---- */
.v2 { overflow-y: auto; }
.v2 .hero { padding: 132px 48px 36px; display: flex; align-items: flex-end; gap: 24px; }
.v2 .hero h1 { margin: 0; font-size: 15px; font-weight: 500; color: var(--ink-2); max-width: 420px; line-height: 1.6; }
.v2 .hero .cnt { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.v2 ol { list-style: none; margin: 0; padding: 0 48px 120px; }
.v2 li { position: relative; display: grid; grid-template-columns: 72px 1fr auto 140px; align-items: baseline; gap: 24px; padding: 18px 0 16px; border-top: 1px solid var(--line); cursor: pointer; transition: opacity .3s var(--ease-hover); }
.v2 li:last-child { border-bottom: 1px solid var(--line); }
.v2 ol:hover li { opacity: .25; } .v2 ol li:hover { opacity: 1; }
.v2 .nm { font-size: 76px; line-height: 1; font-weight: 600; letter-spacing: -0.045em; transition: transform .45s var(--ease-out); }
.v2 li:hover .nm { transform: translateX(14px); }
.v2 .num { font-size: 14px; color: var(--ink-3); }
.v2 .kind { font-size: 14px; color: var(--ink-2); }
.v2 .tg { font-size: 14px; color: var(--ink-3); text-align: right; }
.v2 .float { position: absolute; left: 0; top: 0; width: 340px; height: 227px; border-radius: 10px; overflow: hidden; pointer-events: none; z-index: 6; opacity: 0; transform-origin: 50% 50%; box-shadow: 0 30px 60px rgba(0,0,0,.18); transition: opacity .25s var(--ease-out); }
.v2 .float.on { opacity: 1; }

/* ---- 3 单幅 ---- */
.v3 .art-wrap { position: absolute; right: 0; top: 0; bottom: 0; width: 62%; overflow: hidden; }
.v3 .art-wrap .layer { position: absolute; inset: 0; transition: opacity .9s var(--ease-in-out), transform 1.6s var(--ease-in-out), filter .9s var(--ease-in-out); }
.v3 .art-wrap .layer.leave { opacity: 0; transform: scale(1.06); filter: blur(12px); }
/* 遮罩从一段实底起、并往左多盖 2px：画布左缘落在小数像素上，会抗锯齿出一道亮线 */
.v3 .art-wrap::after { content: ''; position: absolute; inset: 0 0 0 -2px; background: linear-gradient(90deg, var(--night) 0%, var(--night) 3%, rgba(12,12,14,.0) 32%); pointer-events: none; }
.v3 .side { position: absolute; left: 48px; top: 0; bottom: 0; width: 34%; display: flex; flex-direction: column; justify-content: center; gap: 18px; z-index: 3; }
.v3 .count { font-size: 14px; color: var(--ink-3); }
.v3 .count b { color: var(--ink); font-weight: 500; }
.v3 h2 { margin: 0; font-size: 84px; line-height: 1; font-weight: 650; letter-spacing: -0.045em; }
.v3 .desc { font-size: 16px; color: var(--ink-2); min-height: 26px; max-width: 380px; }
.v3 .chips { display: flex; gap: 8px; }
.v3 .chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.07); color: var(--ink-2); }
.v3 .chip.k { color: var(--kc); background: color-mix(in srgb, var(--kc) 14%, transparent); }
.v3 .acts { display: flex; gap: 10px; margin-top: 10px; }
.v3 .btn { height: 44px; padding: 0 20px; border-radius: 22px; border: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.v3 .btn.p { background: var(--ink); color: var(--night); }
.v3 .btn.g { background: rgba(255,255,255,.06); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.v3 .strip { position: absolute; left: 48px; bottom: 32px; z-index: 4; display: flex; gap: 8px; max-width: calc(100% - 96px); overflow: hidden; }
.v3 .th { flex: none; width: 76px; height: 50px; border-radius: 6px; overflow: hidden; opacity: .4; cursor: pointer; outline: 1px solid transparent; outline-offset: 3px; transition: opacity .25s var(--ease-hover), outline-color .25s var(--ease-hover); }
.v3 .th:hover { opacity: .8; } .v3 .th.on { opacity: 1; outline-color: rgba(255,255,255,.6); }

/* ---- 4 凝结 ---- */
.v4 { overflow-y: auto; }
.v4 .hero { padding: 120px 48px 32px; }
.v4 .hero canvas { display: block; }
.v4 .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 0 48px 80px; }
.v4 .tile { position: relative; cursor: pointer; }
.v4 .tile canvas { display: block; width: 100%; aspect-ratio: 3 / 2; border-radius: 10px; background: #111114; }
.v4 .cap { display: flex; align-items: baseline; gap: 12px; padding: 12px 2px 0; font-size: 15px; }
.v4 .cap .num { font-size: 12px; color: var(--ink-3); }
.v4 .cap .nm { font-weight: 600; }
.v4 .cap .kind { margin-left: auto; font-size: 12px; color: var(--ink-2); }

/* ---- 5 目录册 ---- */
.v5 { overflow-y: auto; }
.v5 .mast { padding: 120px 48px 40px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 24px; align-items: end; border-bottom: 1px solid var(--line); margin: 0 48px; padding-left: 0; padding-right: 0; }
.v5 .mast h1 { grid-column: 1 / 8; margin: 0; font-size: 132px; line-height: .86; font-weight: 700; letter-spacing: -0.06em; }
.v5 .mast p { grid-column: 9 / 13; margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.v5 .cat { display: grid; grid-template-columns: repeat(12, 1fr); gap: 40px 24px; padding: 40px 48px 120px; }
.v5 .it { grid-column: span 4; cursor: pointer; }
.v5 .it.lead { grid-column: span 8; grid-row: span 2; }
.v5 .ph { position: relative; aspect-ratio: 3 / 2; border-radius: 4px; overflow: hidden; background: #ddd; }
.v5 .ph .drift { position: absolute; inset: -12%; animation: drift 26s ease-in-out infinite alternate; }
.v5 .it:hover .drift { animation-duration: 9s; }
@keyframes drift { to { transform: translate(6%, -5%) rotate(2deg) scale(1.04); } }
.v5 .cap { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--paper-ink); margin-top: 12px; font-size: 14px; }
.v5 .cap .num { font-size: 12px; color: var(--ink-3); }
.v5 .cap .nm { font-weight: 600; font-size: 16px; }
.v5 .cap .r { font-size: 12px; color: var(--ink-2); text-align: right; }
.v5 .cap .d { grid-column: 2 / 4; color: var(--ink-2); font-size: 13px; }
.v5 .lead .cap .nm { font-size: 28px; letter-spacing: -0.02em; }

/* ---- 6 横带 ---- */
.v6 .track { position: absolute; left: 0; top: 50%; height: 52%; transform: translateY(-56%); display: flex; gap: 28px; padding-left: 48px; will-change: transform; }
.v6 .slot { flex: none; height: 100%; aspect-ratio: 3 / 2; cursor: pointer; display: flex; flex-direction: column; gap: 14px; }
.v6 .slot .ph { flex: 1; border-radius: 8px; overflow: hidden; transform-origin: 50% 50%; will-change: transform; }
.v6 .slot .cap { display: flex; align-items: baseline; gap: 14px; font-size: 15px; }
.v6 .slot .cap .num { font-size: 12px; color: var(--ink-3); }
.v6 .slot .cap .nm { font-weight: 600; }
.v6 .slot .cap .kind { margin-left: auto; font-size: 12px; color: var(--ink-2); }
.v6 .big { position: absolute; left: 48px; bottom: 34px; font-size: 96px; line-height: .8; font-weight: 700; letter-spacing: -0.05em; }
.v6 .big small { font-size: 24px; color: var(--ink-3); letter-spacing: 0; font-weight: 500; }
.v6 .prog { position: absolute; left: 340px; right: 48px; bottom: 44px; height: 1px; background: var(--line); }
.v6 .prog i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--ink); width: 10%; }
</style>
</head>
<body>
<header class="lab">
  <div class="lab-top">
    <h1>入口页「更高级」· 对照版</h1>
    <div class="pick" id="pick"></div>
    <span class="lab-sep"></span>
    <div class="pick" id="spick"></div>
    <span class="lab-sp"></span>
    <span class="keys"><kbd>数字</kbd> 切档 <kbd>C</kbd> 对照现状 <kbd>S</kbd> 样本 <kbd>R</kbd> 轮次 <kbd>P</kbd> 重播</span>
  </div>
  <div class="lab-note" id="note"></div>
</header>
<main class="stage" id="stage"><div class="frame" id="frame"><div class="screen" id="screen"></div></div></main>
<div class="lab-toast" id="toast"></div>

<script>
/* 现行 public/index.html 原文，由 build.py 注入；第 0 档用它，保证现状是真的现状 */
const CURRENT_HTML = "<!DOCTYPE html>\n<!--\n  ooooxo.com 入口页：列出 /api/services 里的服务入口，点卡片打开，卡角一键复制链接；/#admin 全屏嵌入管理页。\n  与同站 ReleaseHub 管理端同一套语言：暗色中性表面 + 天蓝强调、系统字体栈、Hrige 动效梯子（见 ReleaseHub ADR-0001/0002/0006）。\n  纯静态，零依赖；由 server.js 以 express.static 提供。\n-->\n<html lang=\"zh-CN\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <meta name=\"color-scheme\" content=\"dark\" />\n  <title>ooooxo</title>\n  <style>\n    :root {\n      /* 表面按高度：地面 < 卡 < 浮起；中性不染色 */\n      --bg: #0c0c0e;\n      --surface: #161618;\n      --surface2: #1e1e21;\n      --inset: #25252a;\n      --border: rgba(242, 243, 245, 0.08);\n      --border-strong: rgba(242, 243, 245, 0.15);\n      /* 墨阶 */\n      --text: #f2f3f5;\n      --text2: #9ba1ac;\n      --text3: #5d646f;\n      /* 强调：天蓝主 + 状态色 */\n      --accent: #38bdf8;\n      --accent-tint: rgba(56, 189, 248, 0.12);\n      --green: #34d399;\n      --amber: #fbbf24;\n      --radius: 14px;\n      --radius-sm: 10px;\n      --font: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei',\n        'Noto Sans SC', system-ui, 'Segoe UI', sans-serif;\n      --mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;\n      /* 动效梯子（取自 Hrige tokens.css） */\n      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);\n      --ease-hover: cubic-bezier(0.4, 0, 0.2, 1);\n      --spring-soft: cubic-bezier(0.22, 1.2, 0.36, 1);\n      --t-press: 120ms;\n      --t-fast: 160ms;\n      --t-med: 220ms;\n      --t-slow: 320ms;\n      --stagger: 40ms;\n      --shift: 8px;\n      --pop: 0.96;\n      --press: 0.98;\n    }\n    @media (prefers-reduced-motion: reduce) {\n      :root { --spring-soft: var(--ease-out); --t-press: 1ms; --stagger: 0ms; --shift: 0px; --pop: 1; --press: 1; }\n    }\n\n    *, *::before, *::after { box-sizing: border-box; }\n    html, body { margin: 0; min-height: 100%; }\n    body {\n      background: var(--bg);\n      color: var(--text);\n      font-family: var(--font);\n      line-height: 1.55;\n      font-variant-numeric: tabular-nums;\n      -webkit-font-smoothing: antialiased;\n    }\n    /* 极淡的网格底：与 ReleaseHub 管理端同一张纸 */\n    body::before {\n      content: '';\n      position: fixed;\n      inset: 0;\n      background-image: linear-gradient(rgba(236, 233, 227, 0.013) 1px, transparent 1px),\n        linear-gradient(90deg, rgba(236, 233, 227, 0.013) 1px, transparent 1px);\n      background-size: 34px 34px;\n      pointer-events: none;\n    }\n    a { color: inherit; text-decoration: none; }\n    button { font: inherit; color: inherit; }\n\n    .wrap { position: relative; max-width: 1040px; margin: 0 auto; padding: 28px 24px 64px; }\n\n    /* ── 顶栏：品牌在左，两枚纯字形按钮在右（hover 只动墨阶，不铺底） ── */\n    .top { display: flex; align-items: center; gap: 12px; }\n    .brand { display: flex; align-items: center; gap: 11px; margin-right: auto; border-radius: var(--radius-sm); }\n    .brand-mark {\n      width: 34px; height: 34px; border-radius: 10px;\n      display: grid; place-items: center;\n      background: var(--accent-tint); color: var(--accent);\n    }\n    .brand-mark svg { width: 18px; height: 18px; }\n    .brand-name { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }\n    .glyph {\n      width: 36px; height: 36px; border: 0; background: none; border-radius: var(--radius-sm);\n      display: grid; place-items: center; color: var(--text3); cursor: pointer;\n      transition: color var(--t-fast) var(--ease-hover), transform var(--t-press) var(--ease-out);\n    }\n    .glyph:hover { color: var(--text); }\n    .glyph:active { transform: scale(0.92); }\n    .glyph svg { width: 18px; height: 18px; }\n    .glyph.is-done { color: var(--green); }\n\n    /* ── 标题：站名领头，计数作为一枚数据原子 ── */\n    .head { margin: 56px 0 22px; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }\n    .head-titles { margin-right: auto; }\n    h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }\n    .count { margin-top: 8px; font-size: 0.82rem; color: var(--text2); }\n    .count b { color: var(--text); font-weight: 650; }\n\n    .search { position: relative; width: min(320px, 100%); }\n    .search svg { position: absolute; left: 13px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--text3); pointer-events: none; }\n    .search input {\n      width: 100%; padding: 10px 40px 10px 37px;\n      background: var(--surface); color: var(--text);\n      border: 1px solid var(--border); border-radius: var(--radius-sm);\n      font: inherit; font-size: 0.88rem;\n      transition: border-color var(--t-fast) var(--ease-hover), box-shadow var(--t-fast) var(--ease-hover);\n    }\n    .search input::placeholder { color: var(--text3); }\n    .search input:focus { outline: none; border-color: rgba(56, 189, 248, 0.45); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12); }\n    .search kbd {\n      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);\n      font-family: var(--mono); font-size: 0.7rem; color: var(--text3);\n      border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 6px; line-height: 18px;\n    }\n    .search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { opacity: 0; }\n\n    /* ── 入口卡网格 ── */\n    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 13px; }\n    .card {\n      position: relative; display: flex; flex-direction: column; min-height: 150px; padding: 16px;\n      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);\n      transition: border-color var(--t-fast) var(--ease-hover), box-shadow var(--t-fast) var(--ease-hover),\n        transform var(--t-press) var(--ease-out);\n    }\n    /* 只在首次载入时依次浮上；搜索筛选是原地换内容，不重放 */\n    .grid.intro .card {\n      animation: card-in var(--t-slow) var(--ease-out) both;\n      animation-delay: calc(var(--i, 0) * var(--stagger));\n    }\n    .card:hover { border-color: var(--border-strong); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }\n    .card:active { transform: scale(var(--press)); }\n    .card:has(.hit:focus-visible) { outline: 2px solid rgba(56, 189, 248, 0.6); outline-offset: 2px; }\n    .card.is-off { opacity: 0.55; }\n    /* 整卡可点：链接铺满卡面，卡角按钮叠在上面 */\n    .hit { position: absolute; inset: 0; border-radius: inherit; z-index: 1; }\n    .hit:focus-visible { outline: none; }\n    .c-head { display: flex; align-items: flex-start; gap: 12px; }\n    .mono-tile {\n      flex: none; width: 40px; height: 40px; border-radius: 11px;\n      display: grid; place-items: center;\n      font-size: 1.05rem; font-weight: 750;\n      color: var(--hue); background: color-mix(in srgb, var(--hue) 14%, transparent);\n    }\n    .mono-tile svg, .mono-tile img { width: 20px; height: 20px; }\n    .c-titles { flex: 1; min-width: 0; }\n    .c-name { display: block; font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n    .c-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }\n    .chip { font-size: 0.66rem; font-weight: 650; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; line-height: 1.5; background: var(--inset); color: var(--text2); }\n    /* 类型胶囊：一类一色，与 ReleaseHub 的类型胶囊同义（应用天蓝 / 资源库绿 / 站点靛） */\n    .chip.k-app { color: #38bdf8; background: rgba(56, 189, 248, 0.12); }\n    .chip.k-res { color: #34d399; background: rgba(52, 211, 153, 0.12); }\n    .chip.k-site { color: #818cf8; background: rgba(129, 140, 248, 0.13); }\n    .chip.off { color: var(--amber); background: rgba(251, 191, 36, 0.12); }\n    .c-copy { position: relative; z-index: 2; margin: -8px -8px 0 0; }\n    .c-desc {\n      margin: 12px 0 0; font-size: 0.82rem; color: var(--text2);\n      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;\n    }\n    .c-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 8px; }\n    .c-host { flex: 1; min-width: 0; font-family: var(--mono); font-size: 0.7rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n    .c-go { flex: none; width: 16px; height: 16px; color: var(--text3); transition: color var(--t-fast) var(--ease-hover), transform var(--t-med) var(--ease-out); }\n    .card:hover .c-go { color: var(--accent); transform: translateX(3px); }\n\n    /* 载入中：骨架卡占住版面，数据到了原地换上 */\n    .card.skel { animation: skel 1.1s ease-in-out infinite alternate; }\n    .skel .bar { height: 10px; border-radius: 6px; background: var(--inset); }\n\n    .state { grid-column: 1 / -1; padding: 48px 20px; text-align: center; color: var(--text2); font-size: 0.9rem; border: 1px dashed var(--border-strong); border-radius: var(--radius); }\n    .state b { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }\n    .state button, .state a { margin-top: 14px; display: inline-block; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: none; color: var(--text2); font-size: 0.82rem; cursor: pointer; }\n    .state button:hover, .state a:hover { color: var(--text); }\n\n    .foot { margin-top: 48px; font-size: 0.74rem; color: var(--text3); text-align: center; }\n\n    #toast {\n      position: fixed; left: 50%; bottom: 24px; z-index: 50;\n      padding: 10px 16px; border-radius: var(--radius-sm);\n      background: var(--surface2); border: 1px solid var(--border-strong); color: var(--text); font-size: 0.85rem;\n      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);\n      opacity: 0; transform: translate(-50%, var(--shift)); pointer-events: none;\n      transition: opacity var(--t-med) var(--ease-out), transform var(--t-med) var(--ease-out);\n    }\n    #toast.show { opacity: 1; transform: translate(-50%, 0); }\n\n    /* 结果时刻：复制成功原地描勾 */\n    .check path { stroke-dasharray: 24; animation: draw var(--t-slow) var(--ease-out) both; }\n    .is-done svg { animation: pop var(--t-slow) var(--spring-soft); }\n\n    @keyframes card-in { from { opacity: 0; transform: translateY(var(--shift)); } }\n    @keyframes skel { to { opacity: 0.5; } }\n    @keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }\n    @keyframes pop { from { transform: scale(var(--pop)); } }\n\n    #adminRoute { position: fixed; inset: 0; z-index: 100; background: var(--bg); }\n    #adminRoute iframe { width: 100%; height: 100%; border: 0; }\n\n    @media (max-width: 560px) {\n      .wrap { padding: 20px 16px 48px; }\n      .head { margin-top: 36px; }\n      .search { width: 100%; }\n      .search kbd { display: none; }\n    }\n  </style>\n</head>\n<body>\n  <div class=\"wrap\" id=\"main\">\n    <header class=\"top\">\n      <a href=\"/\" class=\"brand\" aria-label=\"首页\">\n        <span class=\"brand-mark\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n            <path d=\"M4 15l8-5 8 5\" opacity=\"0.45\" /><path d=\"M4 10l8-5 8 5\" /><circle cx=\"12\" cy=\"18.5\" r=\"1.8\" fill=\"currentColor\" stroke=\"none\" />\n          </svg>\n        </span>\n        <span class=\"brand-name\">ooooxo</span>\n      </a>\n      <button type=\"button\" class=\"glyph\" id=\"btnShare\" aria-label=\"复制本页链接\" title=\"复制本页链接\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1\" /><path d=\"M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1\" /></svg>\n      </button>\n      <a href=\"#admin\" class=\"glyph\" aria-label=\"管理\" title=\"管理\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\" /><path d=\"M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z\" /></svg>\n      </a>\n    </header>\n\n    <section class=\"head\">\n      <div class=\"head-titles\">\n        <h1 id=\"siteTitle\">入口</h1>\n        <p class=\"count\" id=\"count\">&nbsp;</p>\n      </div>\n      <label class=\"search\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\" /><path d=\"m20 20-3.5-3.5\" /></svg>\n        <input id=\"q\" type=\"search\" placeholder=\"搜索名称、简介、标签\" autocomplete=\"off\" aria-label=\"搜索入口\" />\n        <kbd>/</kbd>\n      </label>\n    </section>\n\n    <main class=\"grid\" id=\"grid\" aria-live=\"polite\"></main>\n    <p class=\"foot\">ooooxo.com</p>\n  </div>\n\n  <div id=\"toast\" role=\"status\"></div>\n  <div id=\"adminRoute\" hidden><iframe id=\"adminFrame\" title=\"管理后台\"></iframe></div>\n\n  <script>\n    /* ── 子路径前缀：Nginx 把本服务挂在 /home 之类的子路径时，API 跟着加前缀；根路径部署为空 ── */\n    const PREFIX = (() => {\n      const m = location.pathname.match(/^(\\/[^/]+)/);\n      return m && !/\\.[a-z0-9]+$/i.test(m[1]) ? m[1] : '';\n    })();\n    const api = p => PREFIX + p;\n\n    /* 管理页早期默认把每个入口都设成这个颜色；它等于「没选过」，按名字自动配色 */\n    const LEGACY_DEFAULT_COLOR = '#c8ff00';\n    /* 自动配色只在这几档里挑：与 ReleaseHub 的类型胶囊同一组色相 */\n    const HUES = ['#38bdf8', '#818cf8', '#34d399', '#fbbf24', '#f472b6', '#2dd4bf'];\n\n    const $ = id => document.getElementById(id);\n    const grid = $('grid');\n    const esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]);\n\n    const ICON_COPY = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\" /><path d=\"M5 15V5a2 2 0 0 1 2-2h10\" /></svg>';\n    const ICON_CHECK = '<svg class=\"check\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\" /></svg>';\n    const ICON_GO = '<svg class=\"c-go\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\" /></svg>';\n\n    function hueOf(s) {\n      if (s.color && s.color.toLowerCase() !== LEGACY_DEFAULT_COLOR) return s.color;\n      let h = 0;\n      for (const ch of s.name) h = (h * 31 + ch.codePointAt(0)) >>> 0;\n      return HUES[h % HUES.length];\n    }\n    /* 入口指向 ReleaseHub 的哪一类页面，就是什么类型；其余都算站点 */\n    function kindOf(url) {\n      if (/\\/releasehub\\/app\\//.test(url)) return { cls: 'k-app', label: '应用' };\n      if (/\\/releasehub\\/r\\//.test(url)) return { cls: 'k-res', label: '资源库' };\n      return { cls: 'k-site', label: '站点' };\n    }\n    function hostPath(url) {\n      return String(url).replace(/^https?:\\/\\//, '').replace(/\\/$/, '');\n    }\n\n    function cardHTML(s, i) {\n      const off = s.status === 'inactive';\n      const tag = (s.displayUrl || '').trim();\n      const tile = s.icon ? s.icon : esc([...s.name.trim()][0] || '·');\n      const kind = kindOf(s.url);\n      const chips = [\n        `<span class=\"chip ${kind.cls}\">${kind.label}</span>`,\n        tag && `<span class=\"chip\">${esc(tag)}</span>`,\n        ...(s.tags || []).map(t => `<span class=\"chip\">${esc(t)}</span>`),\n        off && '<span class=\"chip off\">停用</span>',\n      ].filter(Boolean).join('');\n      return `\n        <article class=\"card${off ? ' is-off' : ''}\" style=\"--hue:${esc(hueOf(s))};--i:${i}\">\n          <a class=\"hit\" href=\"${esc(s.url)}\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 ${esc(s.name)}\"></a>\n          <div class=\"c-head\">\n            <span class=\"mono-tile\" aria-hidden=\"true\">${tile}</span>\n            <div class=\"c-titles\">\n              <span class=\"c-name\">${esc(s.name)}</span>\n              <div class=\"c-chips\">${chips}</div>\n            </div>\n            <button type=\"button\" class=\"glyph c-copy\" data-url=\"${esc(s.url)}\" aria-label=\"复制 ${esc(s.name)} 的链接\" title=\"复制链接\">${ICON_COPY}</button>\n          </div>\n          ${s.description ? `<p class=\"c-desc\">${esc(s.description)}</p>` : ''}\n          <div class=\"c-foot\"><span class=\"c-host\">${esc(hostPath(s.url))}</span>${ICON_GO}</div>\n        </article>`;\n    }\n\n    let all = [];\n    function render() {\n      const q = $('q').value.trim().toLowerCase();\n      const list = q\n        ? all.filter(s => [s.name, s.description, s.displayUrl, s.url, ...(s.tags || [])].some(v => String(v || '').toLowerCase().includes(q)))\n        : all;\n      $('count').innerHTML = q ? `<b>${list.length}</b> / ${all.length} 个入口` : `<b>${all.length}</b> 个入口`;\n      if (!all.length) {\n        grid.innerHTML = '<div class=\"state\"><b>还没有入口</b>在管理页添加第一个服务。<br><a href=\"#admin\">去添加</a></div>';\n      } else if (!list.length) {\n        grid.innerHTML = `<div class=\"state\"><b>没有匹配「${esc(q)}」的入口</b>换个关键词，或清空搜索。</div>`;\n      } else {\n        grid.innerHTML = list.map(cardHTML).join('');\n      }\n    }\n\n    function showSkeleton() {\n      grid.innerHTML = Array.from({ length: 6 }, (_, i) => `\n        <div class=\"card skel\" style=\"--i:${i}\" aria-hidden=\"true\">\n          <div class=\"c-head\"><span class=\"mono-tile\" style=\"--hue:var(--text3)\"></span>\n            <div class=\"c-titles\"><div class=\"bar\" style=\"width:55%\"></div><div class=\"bar\" style=\"width:30%;margin-top:10px\"></div></div></div>\n          <div class=\"c-foot\"><div class=\"bar\" style=\"width:70%\"></div></div>\n        </div>`).join('');\n    }\n\n    async function load() {\n      showSkeleton();\n      try {\n        const r = await fetch(api('/api/services'));\n        if (!r.ok) throw new Error(`HTTP ${r.status}`);\n        all = await r.json();\n        grid.classList.add('intro');\n        render();\n        setTimeout(() => grid.classList.remove('intro'), 800);\n      } catch (e) {\n        grid.innerHTML = `<div class=\"state\"><b>入口列表没取到</b>${esc(e.message)}<br><button type=\"button\" id=\"retry\">重试</button></div>`;\n        $('retry').onclick = load;\n      }\n    }\n\n    fetch(api('/api/config'))\n      .then(r => r.json())\n      .then(c => { if (c.title) { $('siteTitle').textContent = c.title; document.title = c.title; } });\n\n    /* ── 复制：成功在按钮上原地打勾；剪贴板不可用（http 直连）时退回 execCommand ── */\n    let toastTimer;\n    function toast(msg) {\n      $('toast').textContent = msg;\n      $('toast').classList.add('show');\n      clearTimeout(toastTimer);\n      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);\n    }\n    async function copyText(text) {\n      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);\n      const ta = Object.assign(document.createElement('textarea'), { value: text });\n      ta.style.cssText = 'position:fixed;opacity:0';\n      document.body.appendChild(ta);\n      ta.select();\n      const ok = document.execCommand('copy');\n      ta.remove();\n      if (!ok) throw new Error('copy failed');\n    }\n    async function copyFrom(btn, url) {\n      try {\n        await copyText(url);\n      } catch {\n        toast('复制失败，请手动复制');\n        return;\n      }\n      const idle = btn.innerHTML;\n      btn.innerHTML = ICON_CHECK;\n      btn.classList.add('is-done');\n      setTimeout(() => { btn.innerHTML = idle; btn.classList.remove('is-done'); }, 1400);\n    }\n    $('btnShare').addEventListener('click', e => copyFrom(e.currentTarget, location.origin + location.pathname));\n const MOTIFS = [
  { id: 0, word: '流动', why: '默认：没有可读的内容线索' },
  { id: 1, word: '对冲', why: '数据交换：两股液流上下对冲、在中线卷起漩涡' },

  { id: 3, word: '波纹', why: '叩叩：一圈圈从中心荡开，像敲门' },

function motifOf(s) {
  const t = `${s.name} ${s.description || ''} ${s.url}`;
  if (/交换|同步|exchange|sync/i.test(t)) return MOTIFS[1];
  if (/日志|log|记录|周报|journal/i.test(t)) return MOTIFS[2];
  if (/叩|敲|knock|消息|聊天|通知/i.test(t)) return MOTIFS[3];
  if (/资源|文件|下载|镜像|字体|\/r\//i.test(t)) return MOTIFS[4];
  return MOTIFS[0];
}
/* 关联 ②：同一系列共用种子，只换相位 —— Kero 与 Kero企业版 一眼是一家 */
const baseName = n => n.replace(/(企业|专业|社区|旗舰)版$|\s*(Pro|Lite|Plus|Enterprise)$/i, '').trim();
const TINT01 = { 'k-app': [0.59, 0.80, 1.0], 'k-res': [0.59, 0.92, 0.78], 'k-site': [0.72, 0.70, 1.0] };

const VERT = 'attribute vec2 a; varying vec2 v; void main(){ v = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }';
const FRAG = `precision highp float;
varying vec2 v;
uniform vec2 uRes; uniform float uTime, uMix;
uniform vec4 uA, uB; uniform vec3 uTA, uTB; uniform sampler2D uXA, uXB;
/* 不用 sin 的哈希：坐标大了 sin 会丢精度，噪声变成一阶阶台阶 */
float h(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float n(vec2 p) { vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(h(i), h(i + vec2(1., 0.)), u.x), mix(h(i + vec2(0., 1.)), h(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p) { float s = 0., a = .5; mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { s += a * n(p); p = m * p; a *= .5; } return s; }
vec3 shade(vec2 uv, vec4 P, vec3 tint, sampler2D X) {
  float seed = P.x, motif = P.y, tAmt = P.z, ph = P.w, asp = uRes.x / uRes.y, t = uTime * .025;   /* 流速放慢：不急躁 */
  vec2 p = (uv - .5) * vec2(asp, 1.) * 1.7 + seed;
  if (motif > 1.5 && motif < 2.5) p.x *= .3;                                        /* 层流 */
  if (motif > .5 && motif < 1.5) p.x += (smoothstep(.3, .7, uv.y) * 2. - 1.) * 1.6 * sin(uTime * .042); /* 对冲：上下两股来回对冲，幅度有界 */
  /* 字形不进扭曲链（8 位纹理的梯度一进混沌扭曲就会被放大成锯齿），只让字里的液面「静」下来 */
  float tx = texture2D(X, uv).r, calm = clamp(tx * tAmt * .55, 0., .8);
  vec2 q = vec2(fbm(p + vec2(0., t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 3. * q + vec2(1.7, 9.2) + .4 * t), fbm(p + 3. * q + vec2(8.3, 2.8) - .3 * t));
  float val = fbm(p + 3.4 * (1. - calm) * r);
  if (motif > 2.5 && motif < 3.5) { float d = length((uv - vec2(.55, .5)) * vec2(asp, 1.));
    val += .2 * sin(d * 30. - uTime * .7) * exp(-d * 2.2); }                          /* 波纹 */
  if (motif > 3.5) { float k = val * 7., f = fract(k); val = mix(val, (floor(k) + smoothstep(.3, .7, f)) / 7., .75); } /* 台阶：软台阶，边缘不起锯齿 */
  val += tx * tAmt * .09;                                                           /* 字形只微微高出液面：若隐若现 */

}
void main() {
  vec3 a = shade(v, uA, uTA, uXA);
  vec3 b = uMix > .001 ? shade(v, uB, uTB, uXB) : a;
  gl_FragColor = vec4(mix(a, b, uMix), 1.);   /* uMix 已在 JS 里按 ease-in-out 缓动过 */
}`;

/* 关联 ③：标题字形做成一张模糊的「高度图」交给 shader —— 画在小画布上再放大，GPU 线性插值天然就是模糊 */
function textField(s, how, w, h) {
  // 全分辨率画字再模糊：低分辨率纹理的梯度是逐格常数，经扭曲放大会撕出一道道横纹
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  if (how === 'none') return c;
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const str = how === 'initial' ? [...s.name][0] : s.name;
  const fs = how === 'initial' ? c.height * 0.8 : Math.min(c.height * 0.26, (c.width * 0.62) / Math.max(2, [...str].length) * 1.15);
  g.font = `700 ${fs}px -apple-system, "PingFang SC", system-ui, sans-serif`;
  g.filter = `blur(${Math.round(fs * 0.09)}px)`;
  g.fillText(str, c.width * 0.56, c.height * 0.52);
  return c;
}

function liquid(canvas, preserve = false) {
  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: preserve });
  if (!gl) throw new Error('这台浏览器不支持 WebGL');
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const al = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(pr, n);
  const u = { res: U('uRes'), time: U('uTime'), mix: U('uMix'), A: U('uA'), B: U('uB'), TA: U('uTA'), TB: U('uTB'), XA: U('uXA'), XB: U('uXB') };
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  const texCache = new Map();
  function tex(key, cv) {
    if (texCache.has(key)) return texCache.get(key);
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    texCache.set(key, t); return t;
  }
  function params(s, mode) {
    const base = baseName(s.name), hb = hash(base);
    const variant = base !== s.name ? 0.33 : 0;
    const how = mode.text;
    return {
      P: [(hb % 977) / 31, mode.motif ? motifOf(s).id : 0, how === 'none' ? 0 : how === 'initial' ? 1.5 : 1.1, ((hb >>> 12) % 100) / 100 + variant],
      T: TINT01[kindOf(s.url).cls],
      X: tex(`${s.name}|${how}`, textField(s, how, canvas.width, canvas.height)),
    };
  }
  function draw(time, A, B, mixv) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(u.res, canvas.width, canvas.height); gl.uniform1f(u.time, time); gl.uniform1f(u.mix, mixv);
    gl.uniform4fv(u.A, A.P); gl.uniform4fv(u.B, B.P); gl.uniform3fv(u.TA, A.T); gl.uniform3fv(u.TB, B.T);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, A.X); gl.uniform1i(u.XA, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, B.X); gl.uniform1i(u.XB, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  const dispose = () => gl.getExtension('WEBGL_lose_context')?.loseContext();
  return { params, draw, dispose };
}

/* 静态封面（手机环的卡、PC 缩略带）：用同一个 shader 在固定时刻各拍一帧，所以与 PC 大图同源同形 */
const coverCache = new Map();
function bakeCovers(list, mode) {
  const cv = document.createElement('canvas'); cv.width = 480; cv.height = 320;
  const L = liquid(cv, true), out = [];
  for (const s of list) {
    const key = `${s.name}|${mode.motif}|${mode.text}`;
    if (!coverCache.has(key)) { const p = L.params(s, mode); L.draw(12, p, p, 0); coverCache.set(key, cv.toDataURL('image/jpeg', 0.86)); }
    out.push(coverCache.get(key));
  }
  L.dispose();
  return out;
}

function stagePC(S) {
  return `<div class="pg night v3">${brand()}
    <div class="art-wrap"><canvas width="670" height="660"></canvas></div>
    <div class="side"><div class="txt" id="tx"></div>
      <div class="acts"><button class="btn p" data-act="go">打开 ${GL.arrow}</button><button class="btn g" data-act="copy">复制链接</button></div></div>
    <div class="strip">${S.list.map((s, i) => `<div class="th" data-i="${i}"><img class="art" alt="" draggable="false"></div>`).join('')}</div></div>`;
}
function phoneRing(S) {
  return `<div class="pg paper rp">${brand()}
    <div class="ring">${S.list.map((s, i) => `<div class="card" data-i="${i}"><img class="art" alt="" draggable="false"></div>`).join('')}</div>
    <div class="dots">${S.list.map(() => '<i></i>').join('')}</div>
    <div class="meta"><div class="row1"><span class="num swap" id="pNo"></span><span class="nm swap" id="pNm"></span></div>
      <div class="row2"><span class="swap kdot" id="pK"></span><span class="swap" id="pT"></span></div></div>
    <div class="hint">上下滑动转动 · 点正中那张打开</div></div>`;
}
function mountPC(root, S, mode, covers) {
  const pc = root.querySelector('.dev.pc') || root, cv = pc.querySelector('.art-wrap canvas');
  const L = liquid(cv);
  pc.querySelectorAll('.th img').forEach((im, i) => { im.src = covers[i]; });
  let A = L.params(S.list[0], mode), B = A, mixv = 0, mixStart = 0, cur = -1, timer;
  const MIX_MS = 1200;   // 液体换幅比文字（0.45s）慢：先换字，液体再从容地流过去
  function show(i) {
    if (i === cur) return;
    const s = S.list[i], k = kindOf(s.url), m = motifOf(s);
    if (cur >= 0) { if (mixv > 0) A = B; B = L.params(s, mode); mixStart = performance.now(); mixv = 0.0011; } else { A = B = L.params(s, mode); }
    const first = cur < 0;
    cur = i;
    // 文字层叠化：旧层淡出上移，新层同时从下方淡入，两层交叠（与大图的液体叠化同时进行）
    const tx = pc.querySelector('#tx'), sl = document.createElement('div');
    sl.className = 'sl' + (first ? '' : ' in');
    sl.innerHTML = `<div class="count num"><b>${no(i)}</b> / ${no(S.list.length - 1)}</div><h2>${esc(s.name)}</h2><div class="desc">${esc(s.description || '')}</div>`
      + `<div class="chips"><span class="chip k ${k.cls}">${k.label}</span>${s.displayUrl ? `<span class="chip">${esc(s.displayUrl)}</span>` : ''}</div>`
      + `<div class="motif">${mode.motif ? `肌理 · <b>${m.word}</b>　${m.why}` : (mode.text !== 'none' ? '肌理 · <b>字形</b>　标题压进液面' : '')}</div>`;
    tx.querySelectorAll('.sl:not(.out)').forEach(o => { o.classList.add('out'); setTimeout(() => o.remove(), 500); });
    tx.appendChild(sl);
    if (!first) requestAnimationFrame(() => requestAnimationFrame(() => sl.classList.remove('in')));
    pc.querySelectorAll('.th').forEach((t, j) => t.classList.toggle('on', j === i));
  }
  pc.addEventListener('pointerover', e => { const t = e.target.closest('.th'); if (t) { clearTimeout(timer); timer = setTimeout(() => show(Number(t.dataset.i)), 60); } });
  pc.addEventListener('click', e => { const a = e.target.closest('[data-act]')?.dataset.act; if (a === 'go') open(S.list[cur]); if (a === 'copy') toast('已复制 ' + S.list[cur].name + ' 的链接'); });
  const onKey = e => { if (e.key === 'ArrowRight') show((cur + 1) % S.list.length); if (e.key === 'ArrowLeft') show((cur - 1 + S.list.length) % S.list.length); };
  addEventListener('keydown', onKey);
  show(0);
  const stop = loop((dt, now) => {
    if (mixv > 0) { mixv = Math.min(1, (now - mixStart) / MIX_MS); if (mixv >= 1) { A = B; mixv = 0; } }
    L.draw(now / 1000, A, B, mixv > 0 ? EASE_IN_OUT(mixv) : 0);
  });
  return () => { stop(); removeEventListener('keydown', onKey); L.dispose(); };
}
function mountPhone(root, S, covers) {
  const ph = root.querySelector('.dev.phone');
  ph.querySelectorAll('.card img').forEach((im, i) => { im.src = covers[i]; });
  // 每格固定 20°：卡高 167 在半径 520 上约占 18°，20° 正好贴着排；不随入口数变（数量少时一圈不满，不平分拉开）
  return ringRun(ph, S, { W: 390, H: 844, R: 520, cx: 195 - 520 + 22, cy: 330, deg: 20, drag: 0.12, paged: true }, i => {
    const s = S.list[i], k = kindOf(s.url);
    swapText(ph.querySelector('#pNo'), no(i)); swapText(ph.querySelector('#pNm'), s.name);
    const pk = ph.querySelector('#pK'); pk.className = 'swap kdot ' + k.cls; swapText(pk, k.label);
    swapText(ph.querySelector('#pT'), s.displayUrl || '');
    ph.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === i));
  });
}
function duoTier(mode) {
  return {
    size: [1440 + 70 + 390 + 24, 880],
    render: S => `<div class="duo"><div class="dev pc">${stagePC(S)}</div><div class="dev phone">${phoneRing(S)}</div></div>`,
    mount(root, S) {
      const covers = bakeCovers(S.list, mode);
      const a = mountPC(root, S, mode, covers), b = mountPhone(root, S, covers);
      return () => { a(); b(); };
    },
  };
}

/* ---- 轮次与档 ---- */
const ROUNDS = [{
  name: '第一轮',
  list: [
    { v: V.current, name: '现状', thesis: '暗色卡片网格，与 ReleaseHub 同一张纸', parts: [['纸', '暗'], ['结构', '等大卡网格'], ['图', '字首瓦片']], cost: '' },
    { v: V.ring, name: '环', thesis: '照参考站：一圈作品大部分在屏外，一段弧扫过画面', parts: [['纸', '近白 + 墨'], ['结构', '屏外环 一次一张'], ['图', '大幅肌理'], ['动', '惯性 吸附 拉伸'], ['信息', '左编号名 右类型 右上索引']], cost: '最「作品集」，但找某个入口要转；液态粘连 / 粒子没做（要上 WebGL）；手机得另排' },
    { v: V.index, name: '索引', thesis: '名字本身就是界面：大号字一行一个，图跟着指针浮出', parts: [['纸', '近白 + 墨'], ['结构', '大字列表'], ['图', '悬停浮出'], ['动', '弹簧跟随']], cost: '不悬停就看不到图；手机上没有悬停，图得改成行内缩略' },
    { v: V.stage, name: '单幅', thesis: '一次只看一个入口，整幅图压住六成画面', parts: [['纸', '暗'], ['结构', '单幅 + 缩略带'], ['图', '满幅'], ['动', '模糊交叉换幅']], cost: '一屏只讲一个，扫全部要看缩略带；入口多了缩略带横向溢出' },
    { v: V.condense, name: '凝结', thesis: '平时是一片字符粒子，指上去才凝成图', parts: [['纸', '暗'], ['结构', '三列网格'], ['图', 'ASCII → 图'], ['动', '粒子收拢 呼吸']], cost: 'Canvas 每帧重绘，入口多了耗电；不悬停时图是「藏」的，读起来更像装置' },
    { v: V.catalog, name: '目录册', thesis: '瑞士网格的作品目录：第一项领衔，其余三等分，图里金属缓慢流动', parts: [['纸', '近白 + 墨'], ['结构', '12 栏 领衔 + 三等分'], ['图', '大幅 慢流动'], ['信息', '图下编号 名 类型']], cost: '最稳也最「平」，惊喜感最少；领衔项需要定谁来当' },
    { v: V.ribbon, name: '横带', thesis: '一条横向作品带，拖得越快图被拉得越长', parts: [['纸', '近白 + 墨'], ['结构', '横向一条'], ['图', '大幅'], ['动', '惯性 粘滞拉伸'], ['信息', '左下大编号 进度线']], cost: '横向浏览不符合多数人习惯；触控板要横滑或用滚轮代替' },
  ],
}, {
  name: '第二轮：PC 单幅 + 手机环',
  list: [
    { v: duoTier({ motif: true, text: 'none' }), name: '意象', thesis: '封面按内容选液体形态：交换是对冲、日志是层流、资源是台阶、叩叩是波纹',
      parts: [['关联', '内容意象'], ['字', '不入图'], ['PC', 'shader 实时流动'], ['手机', '环 同源封面']], cost: '意象靠关键词猜；Kero 这类没描述的只能拿默认「流动」，要在管理页手选才贴切' },
    { v: duoTier({ motif: false, text: 'name' }), name: '字入液', thesis: '标题字压进液面，液体绕着字形流，名字在金属里若隐若现',
      parts: [['关联', '标题字形'], ['形态', '统一流动'], ['PC', 'shader 实时流动'], ['手机', '环 同源封面']], cost: '与左侧大标题把名字说了两遍；名字长时笔画糊成一团' },
    { v: duoTier({ motif: true, text: 'name' }), name: '意象 + 字', thesis: '形态讲它是做什么的，字形讲它叫什么，两层叠在一张液面里',
      parts: [['关联', '内容意象 + 标题字形'], ['PC', 'shader 实时流动'], ['手机', '环 同源封面']], cost: '信息最满，也最容易「太满」；字形与波纹 / 台阶叠在一起时会互相抢' },
    { v: duoTier({ motif: true, text: 'initial' }), name: '首字为核', thesis: '只取首字，放大成液体包裹的核心，意象在它周围流',
      parts: [['关联', '内容意象 + 首字'], ['PC', 'shader 实时流动'], ['手机', '环 同源封面']], cost: '首字信息量低：Kero 与 Kero企业版都是 K；英文名首字母不如中文首字有形' },
  ],
}];

/* ---- 渲染 ---- */
const KEY = 'lab.portal-ice.';
let round = Math.min(Number(localStorage.getItem(KEY + 'r') ?? ROUNDS.length - 1), ROUNDS.length - 1), showCur = false, cleanup = null;
const cur = ROUNDS.map((r, i) => Math.min(Number(localStorage.getItem(KEY + 'v' + i) ?? (i === 0 ? 1 : 0)), r.list.length - 1));
let size = [1440, 880];
let si = Number(localStorage.getItem(KEY + 's') ?? 1);
const screen = document.getElementById('screen'), frame = document.getElementById('frame');

function fit() {
  const st = document.getElementById('stage'), W = st.clientWidth - 48, H = st.clientHeight - 24;
  const k = Math.min(W / size[0], H / size[1]);
  frame.style.width = size[0] * k + 'px'; frame.style.height = size[1] * k + 'px';
  screen.style.width = size[0] + 'px'; screen.style.height = size[1] + 'px';
  screen.style.transform = `scale(${k})`;
}
function render() {
  cleanup?.(); cleanup = null;
  const list = ROUNDS[round].list, tier = showCur ? ROUNDS[0].list[0] : list[cur[round]];
  size = tier.v.size || [1440, 880]; fit();
  frame.classList.toggle('bare', !!tier.v.size);
  screen.innerHTML = tier.v.render(SPECS[si]);
  cleanup = tier.v.mount(screen, SPECS[si]);
  document.getElementById('pick').innerHTML = ROUNDS.map((r, i) => `<button data-r="${i}" aria-pressed="${i === round}">${r.name}</button>`).join('') + '<span class="lab-sep"></span>' + list.map((x, i) => `<button data-v="${i}" aria-pressed="${!showCur && i === cur[round]}"><b>${i}</b>${x.name}</button>`).join('');
  document.getElementById('spick').innerHTML = SPECS.map((s, i) => `<button data-s="${i}" aria-pressed="${i === si}"><b>${s.key}</b>${s.note}</button>`).join('');
  document.getElementById('note').innerHTML = `<span class="thesis">${showCur ? '（对照中）' : ''}${tier.thesis}</span>${tier.parts.map(([k, t]) => `<span class="part"><i>${k}</i>${t}</span>`).join('')}${tier.cost ? `<span class="cost">代价：${tier.cost}</span>` : ''}`;
}
let tt;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }
document.addEventListener('click', e => {
  const rb = e.target.closest('[data-r]'); if (rb) { round = Number(rb.dataset.r); showCur = false; localStorage.setItem(KEY + 'r', rb.dataset.r); return render(); }
  const pb = e.target.closest('[data-v]'); if (pb) { showCur = false; cur[round] = Number(pb.dataset.v); localStorage.setItem(KEY + 'v' + round, pb.dataset.v); return render(); }
  const sb = e.target.closest('[data-s]'); if (sb) { si = Number(sb.dataset.s); localStorage.setItem(KEY + 's', String(si)); return render(); }
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (a === 'share') toast('已复制本页链接'); if (a === 'admin') toast('进入管理页（/#admin）');
});
addEventListener('keydown', e => {
  if (/^[0-9]$/.test(e.key) && Number(e.key) < ROUNDS[round].list.length) { showCur = false; cur[round] = Number(e.key); localStorage.setItem(KEY + 'v' + round, e.key); return render(); }
  const k = e.key.toLowerCase();
  if (k === 'c') { showCur = !showCur; return render(); }
  if (k === 's') { si = (si + 1) % SPECS.length; localStorage.setItem(KEY + 's', String(si)); return render(); }
  if (k === 'p') return render();
  if (k === 'r' && ROUNDS.length > 1) { round = (round + 1) % ROUNDS.length; showCur = false; localStorage.setItem(KEY + 'r', String(round)); return render(); }
});
addEventListener('resize', fit);
fit(); render();
</script>
